<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>EcoreX Agent</title>
    <style>
      :root {
        background: #080d14;
        color: #f7f8fb;
        font-family: Inter, "Microsoft YaHei", system-ui, sans-serif;
      }

      body {
        margin: 0;
        min-width: 1040px;
        min-height: 100vh;
        overflow: hidden;
        background:
          radial-gradient(circle at 52% 34%, rgba(255, 90, 0, 0.18), transparent 28%),
          linear-gradient(180deg, #070c12, #080d14);
      }

      #startup-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 42%, rgba(255, 90, 0, 0.16), transparent 28%),
          #080d14;
        transition: opacity 0.18s ease, visibility 0.18s ease;
      }

      html[data-ecorex-ready="true"] #startup-loader {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .startup-card {
        width: min(360px, calc(100vw - 48px));
        display: grid;
        justify-items: center;
        gap: 16px;
        color: #f7f8fb;
      }

      .startup-mark {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        display: block;
        object-fit: contain;
        filter: drop-shadow(0 20px 42px rgba(0, 0, 0, 0.36));
      }

      .startup-title {
        margin: 0;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 0;
      }

      .startup-subtitle {
        margin: -8px 0 0;
        color: #a8b0bd;
        font-size: 13px;
      }

      .startup-spinner {
        width: 132px;
        height: 3px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(231, 238, 247, 0.12);
      }

      .startup-spinner::before {
        content: "";
        display: block;
        width: 44%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, #ff5a00, #ffb000);
        animation: ecorex-startup-slide 1s ease-in-out infinite;
      }

      @keyframes ecorex-startup-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(260%); }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-qAzmb2x3.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DddtbJl4.css">
  </head>
  <body>
    <div id="startup-loader" aria-live="polite" aria-label="EcoreX Agent 正在启动">
      <div class="startup-card">
        <img class="startup-mark" src="icon.png" alt="" aria-hidden="true" />
        <h1 class="startup-title">EcoreX 亦芯</h1>
        <p class="startup-subtitle">正在启动本地 Agent 环境...</p>
        <div class="startup-spinner" aria-hidden="true"></div>
      </div>
    </div>
    <div id="root"></div>
  </body>
</html>
