name: e-Mate manual WebUI packages
run-name: manual-webui-v${{ inputs.version }}-${{ inputs.local_gate_sha256 }}

on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Draft release tag containing the manual signed handoffs
        required: true
        type: string
      candidate_bundle_sha256:
        description: SHA-256 of the exact versioned direct Candidate archive
        required: true
        type: string
      candidate_commit_sha:
        description: Exact product commit bound by the signed Candidate
        required: true
        type: string
      version:
        description: Exact product SemVer
        required: true
        type: string
      from_version:
        description: Installed version used by the upgrade contract
        required: true
        type: string
      local_gate_sha256:
        description: Signed local gate receipt SHA-256
        required: true
        type: string
      windows_package_sha256:
        description: SHA-256 of the exact Windows package
        required: true
        type: string
      windows_receipt_sha256:
        description: SHA-256 of the Windows package receipt
        required: true
        type: string
      release_repository:
        description: Repository containing the private Draft handoff
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: emate-manual-webui-${{ inputs.version }}-${{ inputs.candidate_commit_sha }}
  cancel-in-progress: false

jobs:
  terminal-universal:
    name: Build and test macOS arm64 terminal package
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'zyfjacksonchen-source/EcoreX' && github.ref == 'refs/heads/main' && github.sha == inputs.candidate_commit_sha }}
    runs-on: macos-15
    timeout-minutes: 60
    environment:
      name: ecorex-release-signing-stable
    steps:
      - name: Checkout exact package producer
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Checkout exact Candidate source for the React WebUI
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.candidate_commit_sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true
          path: .producer/source

      - name: Set up Node for the exact React WebUI
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: .producer/source/desktop/package-lock.json

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.9"

      - name: Install exact package verification dependencies
        run: python scripts/install-v1-python-profile.py --profile runtime

      - name: Build the Candidate source-bound React WebUI
        working-directory: .producer/source/desktop
        run: |
          npm ci
          npm run build

      - name: Download authenticated manual Candidate and Windows handoffs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_READ_TOKEN: ${{ secrets.ECOREX_GITHUB_RELEASE_READ_TOKEN }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          RELEASE_REPOSITORY: ${{ inputs.release_repository }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          export GH_TOKEN="${RELEASE_READ_TOKEN:-$GH_TOKEN}"
          mkdir -p .producer/downloads
          for name in \
            "EcoreX_${VERSION}-direct-candidate.zip" \
            "EcoreX_${VERSION}-webui-windows-x64.zip" \
            emate-webui-build-receipt.json
          do
            gh release download "$CANDIDATE_TAG" \
              --repo "$RELEASE_REPOSITORY" \
              --dir .producer/downloads \
              --pattern "$name"
          done

      - name: Verify and extract the exact Candidate handoff
        env:
          CANDIDATE_BUNDLE_SHA256: ${{ inputs.candidate_bundle_sha256 }}
          CANDIDATE_COMMIT_SHA: ${{ inputs.candidate_commit_sha }}
          WINDOWS_PACKAGE_SHA256: ${{ inputs.windows_package_sha256 }}
          WINDOWS_RECEIPT_SHA256: ${{ inputs.windows_receipt_sha256 }}
          VERSION: ${{ inputs.version }}
          EXPECTED_VERSION: ${{ inputs.version }}
          FROM_VERSION: ${{ inputs.from_version }}
          LOCAL_GATE_SHA256: ${{ inputs.local_gate_sha256 }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_BUNDLE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CANDIDATE_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WINDOWS_PACKAGE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$WINDOWS_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$LOCAL_GATE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$EXPECTED_VERSION" != "$FROM_VERSION"
          printf '%s  %s\n' "$CANDIDATE_BUNDLE_SHA256" ".producer/downloads/EcoreX_${VERSION}-direct-candidate.zip" | shasum -a 256 -c -
          printf '%s  %s\n' "$WINDOWS_PACKAGE_SHA256" ".producer/downloads/EcoreX_${VERSION}-webui-windows-x64.zip" | shasum -a 256 -c -
          printf '%s  %s\n' "$WINDOWS_RECEIPT_SHA256" .producer/downloads/emate-webui-build-receipt.json | shasum -a 256 -c -
          python scripts/extract-v1-workflow-artifact.py \
            --archive ".producer/downloads/EcoreX_${VERSION}-direct-candidate.zip" \
            --expected-sha256 "$CANDIDATE_BUNDLE_SHA256" \
            --output .producer/candidate \
            --required-root output \
            --receipt .producer/candidate-extraction.json
          CANDIDATE_COMMIT_SHA="$CANDIDATE_COMMIT_SHA" python - <<'PY'
          import json, os
          from pathlib import Path
          receipt = json.loads(Path('.producer/candidate/output/candidate-build-receipt.json').read_text())
          if (receipt.get('status') != 'passed' or receipt.get('commit_sha') != os.environ['CANDIDATE_COMMIT_SHA'] or receipt.get('version') != os.environ['EXPECTED_VERSION']):
              raise SystemExit('candidate_commit_mismatch')
          PY

      - name: Materialize the admitted release public key
        env:
          RELEASE_PUBLIC_KEY: ${{ vars.ECOREX_RELEASE_SIGNER_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_PUBLIC_KEY"
          printf '%s' "$RELEASE_PUBLIC_KEY" | /usr/bin/base64 -D > "$RUNNER_TEMP/release-public-key.bin"
          test "$(stat -f %z "$RUNNER_TEMP/release-public-key.bin")" = 32

      - name: Build the Candidate-bound terminal WebUI package
        env:
          ECOREX_RELEASE_SIGNER_KEY_ID: ${{ vars.ECOREX_RELEASE_SIGNER_KEY_ID }}
          ECOREX_RELEASE_SIGNER_PUBLIC_KEY: ${{ vars.ECOREX_RELEASE_SIGNER_PUBLIC_KEY }}
        run: >-
          python scripts/build-v030-macos-universal-webui.py
          --terminal-distribution
          --candidate-root .producer/candidate
          --web-dist .producer/source/desktop/dist
          --windows-package .producer/downloads/EcoreX_${{ inputs.version }}-webui-windows-x64.zip
          --windows-receipt .producer/downloads/emate-webui-build-receipt.json
          --output .producer/output
          --version ${{ inputs.version }}
          --commit-sha ${{ inputs.candidate_commit_sha }}

      - name: Prove the legacy pointer consumes only the verified receipt
        run: >-
          python -m ecorex.release.legacy_webui_manifest
          .producer/output/webui-build-receipt.json
          .producer/legacy-pointer/manifest.json

      - name: Install, launch, and verify as a real macOS arm64 user
        run: >-
          bash scripts/smoke-v030-macos-terminal-package.sh
          .producer/output/EcoreX_${{ inputs.version }}-webui-macos-universal.zip
          arm64
          .producer/output/macos-arm64-user-smoke.json
          ${{ inputs.version }}

      - name: Upload package handoff and arm64 user evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emate-v${{ inputs.version }}-arm64-qualified-webui-packages
          path: |
            .producer/output/EcoreX_${{ inputs.version }}-webui-macos-universal.zip
            .producer/output/webui-build-receipt.json
            .producer/output/macos-distribution-receipt.json
            .producer/output/macos-arm64-user-smoke.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  macos-x64-user:
    name: Install and launch macOS x64 terminal package
    needs: terminal-universal
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Checkout exact smoke executor
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Download the arm64-qualified macOS package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: emate-v${{ inputs.version }}-arm64-qualified-webui-packages
          path: .producer/package

      - name: Set up Python 3.11 for the user receipt
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.9"

      - name: Install exact package verification dependencies
        run: python scripts/install-v1-python-profile.py --profile runtime

      - name: Install, launch, and verify as a real macOS x64 user
        run: >-
          bash scripts/smoke-v030-macos-terminal-package.sh
          .producer/package/EcoreX_${{ inputs.version }}-webui-macos-universal.zip
          x86_64
          .producer/macos-x64-user-smoke.json
          ${{ inputs.version }}

      - name: Retain x64 user evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emate-v${{ inputs.version }}-macos-x64-user-smoke
          path: .producer/macos-x64-user-smoke.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  windows-x64-user:
    name: Install and launch Windows x64 terminal package
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'zyfjacksonchen-source/EcoreX' && github.ref == 'refs/heads/main' && github.sha == inputs.candidate_commit_sha }}
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout exact smoke executor
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.candidate_commit_sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Download and authenticate the exact Windows handoff
        env:
          GH_TOKEN: ${{ secrets.ECOREX_GITHUB_RELEASE_READ_TOKEN }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          RELEASE_REPOSITORY: ${{ inputs.release_repository }}
          VERSION: ${{ inputs.version }}
          WINDOWS_PACKAGE_SHA256: ${{ inputs.windows_package_sha256 }}
          WINDOWS_RECEIPT_SHA256: ${{ inputs.windows_receipt_sha256 }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .producer/downloads | Out-Null
          gh release download $env:CANDIDATE_TAG --repo $env:RELEASE_REPOSITORY --dir .producer/downloads --pattern "EcoreX_$env:VERSION-webui-windows-x64.zip" --pattern emate-webui-build-receipt.json
          if ((Get-FileHash -Algorithm SHA256 ".producer/downloads/EcoreX_$env:VERSION-webui-windows-x64.zip").Hash.ToLowerInvariant() -ne $env:WINDOWS_PACKAGE_SHA256) { throw "windows_package_digest_mismatch" }
          if ((Get-FileHash -Algorithm SHA256 .producer/downloads/emate-webui-build-receipt.json).Hash.ToLowerInvariant() -ne $env:WINDOWS_RECEIPT_SHA256) { throw "windows_receipt_digest_mismatch" }

      - name: Install and launch as a real Windows x64 user
        shell: pwsh
        run: >-
          ./scripts/smoke-v030-windows-terminal-package.ps1
          -PackagePath .producer/downloads/EcoreX_${{ inputs.version }}-webui-windows-x64.zip
          -ReceiptPath .producer/windows-x64-user-smoke.json
          -ExpectedVersion ${{ inputs.version }}

      - name: Retain Windows real-user evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emate-v${{ inputs.version }}-windows-x64-user-smoke
          path: .producer/windows-x64-user-smoke.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
