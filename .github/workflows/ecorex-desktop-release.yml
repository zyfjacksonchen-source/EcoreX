name: EcoreX Desktop Release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ecorex-desktop-release.yml"
      - "desktop/**"
  workflow_dispatch:
    inputs:
      mac_arch:
        description: "macOS architecture to build"
        type: choice
        default: all
        options:
          - all
          - arm64
          - x64
      notarize:
        description: "Submit macOS DMG to Apple notarization when secrets are present"
        type: boolean
        default: true
      release_tag:
        description: "GitHub release tag for workflow-dispatched DMG assets"
        type: string
        default: v0.1.12

permissions:
  contents: write

jobs:
  macos-dmg:
    name: macOS DMG (${{ matrix.arch }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.mac_arch != 'all' && format('["{0}"]', inputs.mac_arch) || '["arm64","x64"]') }}

    defaults:
      run:
        working-directory: desktop

    env:
      PYTHON_STANDALONE_RELEASE: "20260602"
      PYTHON_STANDALONE_GITHUB_TOKEN: ${{ github.token }}
      CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Require macOS signing and notarization secrets
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.notarize }}
        run: |
          missing=0
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required macOS notarization secret: $name" >&2
              missing=1
            fi
          done
          if [[ "$missing" != "0" ]]; then
            echo "Refusing to build a public macOS DMG without Developer ID signing and Apple notarization credentials." >&2
            exit 1
          fi
      - name: Build DMG
        run: |
          if [[ -z "${CSC_LINK:-}" ]]; then
            unset CSC_LINK
            unset CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npm run "package:mac:${{ matrix.arch }}"

      - name: Notarize and staple DMG
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.notarize }}
        run: |
          if [[ -z "${CSC_LINK}" || -z "${APPLE_ID}" || -z "${APPLE_APP_SPECIFIC_PASSWORD}" || -z "${APPLE_TEAM_ID}" ]]; then
            echo "Code signing or Apple notarization secrets are not configured; refusing unsigned public DMG." >&2
            exit 1
          fi
          for dmg in release/EcoreX_*_${{ matrix.arch }}.dmg; do
            echo "Submitting $dmg for notarization"
            xcrun notarytool submit "$dmg" \
              --apple-id "${APPLE_ID}" \
              --team-id "${APPLE_TEAM_ID}" \
              --password "${APPLE_APP_SPECIFIC_PASSWORD}" \
              --wait
            xcrun stapler staple "$dmg"
          done

      - name: Validate notarized artifacts
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.notarize }}
        run: |
          if [[ -z "${APPLE_ID}" || -z "${APPLE_APP_SPECIFIC_PASSWORD}" || -z "${APPLE_TEAM_ID}" || -z "${CSC_LINK}" ]]; then
            echo "Signing/notarization secrets are incomplete; strict validation cannot be skipped for a public DMG." >&2
            exit 1
          fi
          npm run validate:mac

      - name: Hash artifacts
        run: |
          shasum -a 256 release/EcoreX_*_${{ matrix.arch }}.dmg > "release/EcoreX_${{ matrix.arch }}.sha256"
          cat "release/EcoreX_${{ matrix.arch }}.sha256"

      - name: Publish workflow-dispatched DMG to GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --title "EcoreX ${RELEASE_TAG}" \
              --notes "EcoreX ${RELEASE_TAG} release artifacts." \
              --target "${GITHUB_SHA}"
          fi
          gh release upload "${RELEASE_TAG}" \
            release/EcoreX_*_${{ matrix.arch }}.dmg \
            release/EcoreX_${{ matrix.arch }}.sha256 \
            --clobber
