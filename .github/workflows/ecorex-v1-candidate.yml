name: EcoreX v1 protected Candidate

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Signed release channel
        required: true
        type: choice
        default: canary
        options:
          - canary
          - stable
      staging_run_id:
        description: Successful protected platform-stage workflow run for this exact commit
        required: true
        type: string
      ci_run_id:
        description: Successful protected EcoreX v1 CI run for this exact commit
        required: true
        type: string
      ci_run_attempt:
        description: Exact successful attempt number of the EcoreX v1 CI run
        required: true
        type: string
      delta_base_tag:
        description: Optional prior immutable GitHub Release tag used to derive signed Core deltas
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ecorex-v1-candidate-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  validate-request:
    name: Validate protected dispatch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Refuse unpinned source or malformed immutable inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_SHA: ${{ vars.ECOREX_V031_RELEASE_COMMIT_SHA }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          CI_RUN_ATTEMPT: ${{ inputs.ci_run_attempt }}
          DELTA_BASE_TAG: ${{ inputs.delta_base_tag }}
        run: |
          python - <<'PY'
          import os, re
          ok = (
              os.environ["EVENT_NAME"] == "workflow_dispatch"
              and os.environ["REPOSITORY"] == "zyfjacksonchen-source/EcoreX"
              and os.environ["REF_NAME"] == "refs/heads/main"
              and re.fullmatch(r"[0-9a-f]{40}", os.environ["RELEASE_SHA"] or "")
              and os.environ["SOURCE_SHA"] == os.environ["RELEASE_SHA"]
              and re.fullmatch(r"[1-9][0-9]{0,18}", os.environ["STAGING_RUN_ID"] or "")
              and re.fullmatch(r"[1-9][0-9]{0,18}", os.environ["CI_RUN_ID"] or "")
              and re.fullmatch(r"[1-9][0-9]{0,8}", os.environ["CI_RUN_ATTEMPT"] or "")
              and (
                  not os.environ["DELTA_BASE_TAG"]
                  or re.fullmatch(r"v[0-9A-Za-z][0-9A-Za-z.+-]{0,126}", os.environ["DELTA_BASE_TAG"])
              )
          )
          raise SystemExit(0 if ok else 1)
          PY

  quality:
    name: Full source, contract, migration and supply-chain gates
    needs: validate-request
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout immutable source without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch and verify the complete fixed v0.3.0 Git object set
        env:
          V030_RELEASE_COMMIT: f0750d247bfe52ffb95c137cadc9983a03010690
        run: |
          git fetch --no-tags --force origin "$V030_RELEASE_COMMIT"
          python scripts/check-v1-release-baseline.py \
            --commit "$V030_RELEASE_COMMIT" \
            --output .candidate/quality/v030-baseline.json

      - name: Reject invisible untracked source and whitespace drift
        run: |
          git diff --check HEAD --
          python scripts/check-v1-source-tree.py

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: |
            requirements/locks/bootstrap.lock
            requirements/locks/cloud.lock
            requirements/locks/dev.lock
            requirements/locks/manifest.json

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install runner-only development dependencies
        run: python scripts/install-v1-python-profile.py --profile dev

      - name: Resolve production cloud adapters from the reviewed lock
        run: |
          python scripts/install-v1-python-profile.py --profile cloud
          python -c "import boto3, psycopg, psycopg_pool"

      - name: Lint and compile Runtime
        run: python scripts/run-v1-lint.py --compile --output-format=github

      # The workflow owns the one real Web build. Every Web and Python contract
      # below consumes these exact bytes and must not rebuild desktop/dist.
      - name: Install exact WebUI dependencies
        working-directory: desktop
        run: npm ci

      - name: Reject high-severity WebUI dependency vulnerabilities
        working-directory: desktop
        run: npm audit --audit-level=high

      - name: Type-check WebUI
        working-directory: desktop
        run: npm run typecheck

      - name: Build content-addressed WebUI
        working-directory: desktop
        run: npm run build

      - name: Seal the WebUI bytes before any acceptance suite
        run: >-
          python scripts/check-v1-reproducibility.py
          --web-dist desktop/dist
          --write-manifest .candidate/quality/web-dist-immutability/before/byte-contract.json

      - name: Test the built WebUI
        working-directory: desktop
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ../.candidate/quality/playwright-report.json
        run: |
          npm run test:v1
          npx playwright test --config=playwright.config.ts --reporter=json

      - name: Unit, contract and integration suites
        run: >-
          python -m pytest -q -p no:cacheprovider
          --junitxml=.candidate/quality/full-pytest.xml
          tests/v1

      - name: Explicit release and protocol contracts
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/v1/test_release_builder.py
          tests/v1/test_release_capability_pack.py
          tests/v1/test_release_asset_publication.py
          tests/v1/test_control_plane_release_flow.py
          tests/v1/test_update_wss_e2e.py
          tests/v1/test_real_web_release_pipeline.py

      - name: Migration dry-run and schema authority
        run: |
          python -m pytest -q -p no:cacheprovider \
            --junitxml=.candidate/quality/migration-pytest.xml \
            tests/v1/test_migration_copy_on_write.py \
            tests/v1/test_product_legacy_migration.py \
            tests/v1/test_migration_quarantine.py \
            tests/v1/test_v030_release_schema_archive.py \
            tests/v1/test_candidate_storage_migrations.py \
            tests/v1/test_update_activation_health.py
          python scripts/check-v1-runtime-schema-authority.py
          python scripts/check-v1-server-schema-authority.py

      - name: Prove every acceptance suite consumed the WebUI read-only
        run: |
          python scripts/check-v1-reproducibility.py \
            --web-dist desktop/dist \
            --write-manifest .candidate/quality/web-dist-immutability/after/byte-contract.json
          python scripts/check-v1-reproducibility.py \
            --compare-manifests .candidate/quality/web-dist-immutability \
            --expected-count 2

      - name: Static product gates
        run: |
          python scripts/check-v1-design-system.py
          python scripts/check-v1-dependency-locks.py
          python scripts/check-v1-legacy-cutoff.py --strict-production
          python scripts/check-v1-public-download-site.py
          python scripts/check-v1-reproducibility.py --web-dist desktop/dist --write-manifest .candidate/quality/byte-contract.json

      - name: License and secret scan
        run: >-
          python scripts/check-v1-candidate-supply-chain.py preflight
          --repo .
          --report .candidate/quality/supply-chain.json

      - name: Seal completed source-quality job
        run: >-
          python scripts/write-v1-quality-evidence.py
          --commit-sha ${{ github.sha }}
          --workflow-run-id ${{ github.run_id }}
          --byte-contract .candidate/quality/byte-contract.json
          --supply-chain .candidate/quality/supply-chain.json
          --baseline-evidence .candidate/quality/v030-baseline.json
          --full-pytest-junit .candidate/quality/full-pytest.xml
          --migration-pytest-junit .candidate/quality/migration-pytest.xml
          --playwright-json .candidate/quality/playwright-report.json
          --output .candidate/quality/quality-complete.json

      - name: Upload WebUI, quality evidence and gates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecorex-v1-candidate-quality
          path: |
            desktop/dist
            .candidate/quality
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  image-shared-storage:
    name: Real PostgreSQL and MinIO two-node-id concurrency
    needs: validate-request
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16.9@sha256:7c688148e5e156d0e86df7ba8ae5a05a2386aaec1e2ad8e6d11bdf10504b1fb7
        env:
          POSTGRES_DB: ecorex_image_gate
          POSTGRES_PASSWORD: ecorex-image-gate
          POSTGRES_USER: ecorex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecorex -d ecorex_image_gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout exact source without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.9"

      - name: Install exact test and cloud dependencies
        run: |
          python scripts/install-v1-python-profile.py --profile dev
          python scripts/install-v1-python-profile.py --profile cloud

      - name: Start isolated digest-pinned MinIO
        run: |
          docker run --detach --rm \
            --name "ecorex-minio-${{ github.run_id }}-shared" \
            --publish 127.0.0.1:9000:9000 \
            --env MINIO_ROOT_USER=ecorex-test \
            --env MINIO_ROOT_PASSWORD=ecorex-test-secret \
            minio/minio@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e \
            server /data
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:9000/minio/health/ready && exit 0
            sleep 1
          done
          exit 1

      - name: Execute the real 256-job two-node-id gate
        env:
          ECOREX_TEST_POSTGRES_DSN: postgresql://ecorex:ecorex-image-gate@127.0.0.1:5432/ecorex_image_gate
          ECOREX_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          ECOREX_TEST_S3_ACCESS_KEY: ecorex-test
          ECOREX_TEST_S3_SECRET_KEY: ecorex-test-secret
        run: >-
          python scripts/run-v1-image-shared-storage-gate.py
          --gate-type shared-storage
          --commit-sha ${{ github.sha }}
          --workflow-run-id ${{ github.run_id }}
          --node-id candidate-shared-a
          --node-id candidate-shared-b
          --jobs 256
          --workers 48
          --minimum-duration-seconds 0
          --output .candidate/image-shared-storage.json

      - name: Upload executed shared-storage evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecorex-v1-image-shared-storage
          path: .candidate/image-shared-storage.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove isolated MinIO
        if: ${{ always() }}
        run: docker rm --force "ecorex-minio-${{ github.run_id }}-shared" || true

  image-soak:
    name: Protected four-hour PostgreSQL and MinIO image soak
    needs: validate-request
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16.9@sha256:7c688148e5e156d0e86df7ba8ae5a05a2386aaec1e2ad8e6d11bdf10504b1fb7
        env:
          POSTGRES_DB: ecorex_image_soak
          POSTGRES_PASSWORD: ecorex-image-soak
          POSTGRES_USER: ecorex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecorex -d ecorex_image_soak"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout exact source without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.9"

      - name: Install exact soak dependencies
        run: |
          python scripts/install-v1-python-profile.py --profile dev
          python scripts/install-v1-python-profile.py --profile cloud

      - name: Start isolated digest-pinned MinIO
        run: |
          docker run --detach --rm \
            --name "ecorex-minio-${{ github.run_id }}-soak" \
            --publish 127.0.0.1:9000:9000 \
            --env MINIO_ROOT_USER=ecorex-test \
            --env MINIO_ROOT_PASSWORD=ecorex-test-secret \
            minio/minio@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e \
            server /data
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:9000/minio/health/ready && exit 0
            sleep 1
          done
          exit 1

      - name: Execute the protected four-hour two-node-id soak
        env:
          ECOREX_TEST_POSTGRES_DSN: postgresql://ecorex:ecorex-image-soak@127.0.0.1:5432/ecorex_image_soak
          ECOREX_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          ECOREX_TEST_S3_ACCESS_KEY: ecorex-test
          ECOREX_TEST_S3_SECRET_KEY: ecorex-test-secret
        run: >-
          python scripts/run-v1-image-shared-storage-gate.py
          --gate-type soak
          --commit-sha ${{ github.sha }}
          --workflow-run-id ${{ github.run_id }}
          --node-id candidate-soak-a
          --node-id candidate-soak-b
          --jobs 256
          --workers 48
          --minimum-duration-seconds 14400
          --output .candidate/image-soak.json

      - name: Upload executed soak evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecorex-v1-image-soak
          path: .candidate/image-soak.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove isolated MinIO
        if: ${{ always() }}
        run: docker rm --force "ecorex-minio-${{ github.run_id }}-soak" || true

  reproducibility-input:
    name: Verify protected cross-runner reproducibility
    needs: validate-request
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout exact verifier without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.9"

      - name: Install exact Runtime verification dependencies
        run: python scripts/install-v1-python-profile.py --profile runtime

      - name: Read exact CI run metadata from this repository
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          CI_RUN_ATTEMPT: ${{ inputs.ci_run_attempt }}
        run: |
          mkdir -p .candidate/ci
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}/attempts/${CI_RUN_ATTEMPT}" \
            > .candidate/ci/run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}/artifacts?per_page=100" \
            > .candidate/ci/artifacts.json

      - name: Select four immutable artifacts from the exact CI attempt
        id: ci-artifacts
        env:
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          CI_RUN_ATTEMPT: ${{ inputs.ci_run_attempt }}
        run: >-
          python scripts/select-v1-ci-reproducibility-artifacts.py
          --run-metadata .candidate/ci/run.json
          --artifact-metadata .candidate/ci/artifacts.json
          --repository "${GITHUB_REPOSITORY}"
          --commit-sha "${GITHUB_SHA}"
          --workflow-run-id "${CI_RUN_ID}"
          --run-attempt "${CI_RUN_ATTEMPT}"
          --protected-ref refs/heads/main
          --max-run-age-seconds 86400
          --output .candidate/ci/artifact-selection.json
          --github-output "${GITHUB_OUTPUT}"

      - name: Download only the four selected immutable artifact IDs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.ci_run_id }}
          artifact-ids: ${{ steps.ci-artifacts.outputs.artifact_ids }}
          path: .candidate/ci/contracts

      - name: Reject stale, foreign, incomplete or non-identical CI evidence
        env:
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          CI_RUN_ATTEMPT: ${{ inputs.ci_run_attempt }}
        run: >-
          python scripts/verify-v1-ci-provenance.py
          --run-metadata .candidate/ci/run.json
          --artifact-metadata .candidate/ci/artifacts.json
          --contracts-root .candidate/ci/contracts
          --repository "${GITHUB_REPOSITORY}"
          --commit-sha "${GITHUB_SHA}"
          --workflow-run-id "${CI_RUN_ID}"
          --run-attempt "${CI_RUN_ATTEMPT}"
          --protected-ref refs/heads/main
          --max-run-age-seconds 86400
          --output .candidate/ci/reproducibility.json

      - name: Upload typed reproducibility source evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecorex-v1-candidate-reproducibility-input
          path: .candidate/ci
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  staging-input:
    name: Verify exact protected staging run
    needs: validate-request
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout verifier without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Read staging run metadata from this repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .candidate
          gh api repos/${{ github.repository }}/actions/runs/${{ inputs.staging_run_id }} > .candidate/staging-run.json

      - name: Reject PR, fork, different commit or untrusted workflow provenance
        run: >-
          python scripts/verify-v1-staging-provenance.py
          --metadata .candidate/staging-run.json
          --expected-run-id ${{ inputs.staging_run_id }}
          --expected-commit ${{ github.sha }}
          --expected-repository ${{ github.repository }}
          --receipt .candidate/staging-provenance.json

      - name: Download all three real platform stages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.staging_run_id }}
          pattern: ecorex-v1-stage-*
          path: .candidate/input
          merge-multiple: true

      - name: Refuse typed failure receipts and incomplete target set
        run: |
          test ! -e .candidate/input/stage-failure.json
          for target in windows-x64 macos-arm64 macos-x64; do
            test -d ".candidate/input/stages/$target/core"
            test -d ".candidate/input/stages/$target/bootstrap"
            test -d ".candidate/input/stages/$target/packs/browser"
            test -d ".candidate/input/stages/$target/packs/image"
            test -d ".candidate/input/stages/$target/packs/sandbox"
            test -f ".candidate/input/receipts/$target/core.json"
            test -f ".candidate/input/receipts/$target/bootstrap.json"
            test -f ".candidate/input/receipts/$target/browser.json"
            test -f ".candidate/input/receipts/$target/image.json"
            test -f ".candidate/input/receipts/$target/sandbox.json"
          done

      - name: Upload consolidated immutable stage input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecorex-v1-candidate-stage-input
          path: |
            .candidate/input
            .candidate/staging-provenance.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  build-and-sign:
    name: Build and externally sign immutable Candidate
    needs:
      - quality
      - staging-input
      - reproducibility-input
      - image-shared-storage
      - image-soak
    environment:
      name: ecorex-release-signing-${{ inputs.channel }}
    runs-on: [self-hosted, linux, arm64, ecorex-release-sign]
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      candidate_artifact_id: ${{ steps.signed_candidate.outputs.artifact-id }}
      candidate_artifact_sha256: ${{ steps.signed_candidate.outputs.artifact-digest }}
    steps:
      - name: Checkout exact protected commit without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.9"

      - name: Install runner-only build dependencies
        run: python scripts/install-v1-python-profile.py --profile runtime

      - name: Download verified stage input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ecorex-v1-candidate-stage-input
          path: .candidate/stage-artifact

      - name: Download WebUI and source gate receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ecorex-v1-candidate-quality
          path: .candidate/quality-artifact

      - name: Download executed image concurrency evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ecorex-v1-image-*
          path: .candidate/image-evidence
          merge-multiple: true

      - name: Download verified cross-runner reproducibility evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ecorex-v1-candidate-reproducibility-input
          path: .candidate/reproducibility-artifact

      - name: Merge stage and gate inputs
        run: |
          mkdir -p .candidate/input .candidate/gates
          cp -R .candidate/stage-artifact/input/. .candidate/input/
          cp .candidate/stage-artifact/staging-provenance.json .candidate/input/staging-provenance.json

      - name: Derive deterministic candidate time from the immutable commit
        id: commit
        run: echo "created_at=$(git show -s --format=%cI ${{ github.sha }})" >> "$GITHUB_OUTPUT"

      - name: Assemble fixed 24-stage recipe
        env:
          ECOREX_RELEASE_MIRROR_BASE_URL: ${{ vars.ECOREX_RELEASE_MIRROR_BASE_URL }}
          ECOREX_RELEASE_CDN_BASE_URL: ${{ vars.ECOREX_RELEASE_CDN_BASE_URL }}
          ECOREX_GITHUB_RELEASE_REPOSITORY: zyfjacksonchen-source/EcoreX-installers
        run: >-
          python scripts/assemble-v1-candidate-recipe.py
          --input-root .candidate/input
          --output .candidate/input/candidate-recipe.json
          --channel ${{ inputs.channel }}
          --created-at "${{ steps.commit.outputs.created_at }}"
          --repository "$ECOREX_GITHUB_RELEASE_REPOSITORY"

      - name: Download optional prior signed Core set for delta derivation
        if: ${{ inputs.delta_base_tag != '' }}
        env:
          # The workflow GITHUB_TOKEN is repository-scoped and cannot read the
          # independent public installer repository.  Keep this credential
          # read-only and separate from the publication writer token.
          GH_TOKEN: ${{ secrets.ECOREX_GITHUB_RELEASE_READ_TOKEN }}
          DELTA_BASE_TAG: ${{ inputs.delta_base_tag }}
          ECOREX_GITHUB_RELEASE_REPOSITORY: zyfjacksonchen-source/EcoreX-installers
        run: |
          mkdir -p .candidate/delta-base
          gh release download "$DELTA_BASE_TAG" \
            --repo "$ECOREX_GITHUB_RELEASE_REPOSITORY" \
            --dir .candidate/delta-base \
            --pattern release-manifest.json \
            --pattern 'ecorex-core-*.zip'

      - name: Build with stdin-only digest-pinned KMS or HSM signer
        env:
          ECOREX_RELEASE_SIGNER_EXECUTABLE: ${{ vars.ECOREX_RELEASE_SIGNER_EXECUTABLE }}
          ECOREX_RELEASE_SIGNER_EXECUTABLE_SHA256: ${{ vars.ECOREX_RELEASE_SIGNER_EXECUTABLE_SHA256 }}
          ECOREX_RELEASE_SIGNER_ADAPTER: ${{ vars.ECOREX_RELEASE_SIGNER_ADAPTER }}
          ECOREX_RELEASE_SIGNER_ADAPTER_SHA256: ${{ vars.ECOREX_RELEASE_SIGNER_ADAPTER_SHA256 }}
          ECOREX_RELEASE_SIGNER_KEY_ID: ${{ vars.ECOREX_RELEASE_SIGNER_KEY_ID }}
          ECOREX_RELEASE_SIGNER_PUBLIC_KEY: ${{ vars.ECOREX_RELEASE_SIGNER_PUBLIC_KEY }}
          DELTA_BASE_TAG: ${{ inputs.delta_base_tag }}
        run: |
          args=(
            --recipe .candidate/input/candidate-recipe.json
            --input-root .candidate/input
            --web-dist .candidate/quality-artifact/desktop/dist
            --output .candidate/output/release
            --receipt .candidate/output/candidate-build-receipt.json
            --expected-commit ${{ github.sha }}
            --expected-staging-run-id ${{ inputs.staging_run_id }}
            --staging-provenance .candidate/input/staging-provenance.json
            --dependency-lock-manifest requirements/locks/manifest.json
          )
          if [[ -n "$DELTA_BASE_TAG" ]]; then
            args+=(--delta-base-release-dir .candidate/delta-base)
          fi
          python scripts/build-v1-candidate.py "${args[@]}"

      - name: Independently verify every signature
        env:
          ECOREX_RELEASE_SIGNER_KEY_ID: ${{ vars.ECOREX_RELEASE_SIGNER_KEY_ID }}
          ECOREX_RELEASE_SIGNER_PUBLIC_KEY: ${{ vars.ECOREX_RELEASE_SIGNER_PUBLIC_KEY }}
        run: >-
          python scripts/verify-v1-release-signatures.py
          --release-dir .candidate/output/release
          --report .candidate/output/signature-report.json

      - name: Bind browser, platform and image executions to this signed Candidate
        env:
          ECOREX_RELEASE_SIGNER_PUBLIC_KEY: ${{ vars.ECOREX_RELEASE_SIGNER_PUBLIC_KEY }}
        run: |
          python scripts/bind-v1-release-gate-evidence.py \
            --gate e2e \
            --source-evidence .candidate/quality-artifact/.candidate/quality/quality-complete.json \
            --candidate-receipt .candidate/output/candidate-build-receipt.json \
            --release-manifest .candidate/output/release/release-manifest.json \
            --trusted-public-key "$ECOREX_RELEASE_SIGNER_PUBLIC_KEY" \
            --staging-provenance .candidate/input/staging-provenance.json \
            --commit-sha ${{ github.sha }} \
            --workflow-run-id ${{ github.run_id }} \
            --expected-staging-run-id ${{ inputs.staging_run_id }} \
            --output .candidate/output/e2e-release-bound.json
          python scripts/bind-v1-release-gate-evidence.py \
            --gate migration-dry-run \
            --source-evidence .candidate/quality-artifact/.candidate/quality/quality-complete.json \
            --candidate-receipt .candidate/output/candidate-build-receipt.json \
            --release-manifest .candidate/output/release/release-manifest.json \
            --trusted-public-key "$ECOREX_RELEASE_SIGNER_PUBLIC_KEY" \
            --staging-provenance .candidate/input/staging-provenance.json \
            --commit-sha ${{ github.sha }} \
            --workflow-run-id ${{ github.run_id }} \
            --expected-staging-run-id ${{ inputs.staging_run_id }} \
            --output .candidate/output/migration-release-bound.json
          python scripts/bind-v1-release-gate-evidence.py \
            --gate image-shared-storage \
            --source-evidence .candidate/image-evidence/image-shared-storage.json \
            --candidate-receipt .candidate/output/candidate-build-receipt.json \
            --release-manifest .candidate/output/release/release-manifest.json \
            --trusted-public-key "$ECOREX_RELEASE_SIGNER_PUBLIC_KEY" \
            --staging-provenance .candidate/input/staging-provenance.json \
            --commit-sha ${{ github.sha }} \
            --workflow-run-id ${{ github.run_id }} \
            --expected-staging-run-id ${{ inputs.staging_run_id }} \
            --output .candidate/output/image-shared-storage-release-bound.json
          python scripts/bind-v1-release-gate-evidence.py \
            --gate image-soak \
            --source-evidence .candidate/image-evidence/image-soak.json \
            --candidate-receipt .candidate/output/candidate-build-receipt.json \
            --release-manifest .candidate/output/release/release-manifest.json \
            --trusted-public-key "$ECOREX_RELEASE_SIGNER_PUBLIC_KEY" \
            --staging-provenance .candidate/input/staging-provenance.json \
            --commit-sha ${{ github.sha }} \
            --workflow-run-id ${{ github.run_id }} \
            --expected-staging-run-id ${{ inputs.staging_run_id }} \
            --output .candidate/output/image-soak-release-bound.json

      - name: Bind cross-runner bytes to this signed Candidate
        env:
          ECOREX_RELEASE_SIGNER_PUBLIC_KEY: ${{ vars.ECOREX_RELEASE_SIGNER_PUBLIC_KEY }}
        run: >-
          python scripts/bind-v1-reproducibility-evidence.py
          --evidence .candidate/reproducibility-artifact/reproducibility.json
          --candidate-receipt .candidate/output/candidate-build-receipt.json
          --release-manifest .candidate/output/release/release-manifest.json
          --trusted-public-key "$ECOREX_RELEASE_SIGNER_PUBLIC_KEY"
          --output .candidate/output/reproducibility-release-bound.json

      - name: Verify generated SBOM, archive secrets and compressed size limits
        run: >-
          python scripts/check-v1-candidate-supply-chain.py release
          --release-dir .candidate/output/release
          --dependency-lock-manifest requirements/locks/manifest.json
          --report .candidate/output/release-supply-chain.json

      - name: Retain exact platform receipts beside Candidate evidence
        run: |
          mkdir -p .candidate/output/evidence
          cp -R .candidate/input/receipts .candidate/output/evidence/stage-receipts
          cp -R .candidate/input/.evidence .candidate/output/evidence/platform-stage
          cp .candidate/stage-artifact/staging-provenance.json .candidate/output/evidence/staging-provenance.json
          cp -R .candidate/quality-artifact/.candidate/quality .candidate/output/evidence/quality
          cp -R .candidate/reproducibility-artifact .candidate/output/evidence/reproducibility-source

      - name: Record signed Candidate gates
        env:
          ECOREX_RELEASE_SIGNER_PUBLIC_KEY: ${{ vars.ECOREX_RELEASE_SIGNER_PUBLIC_KEY }}
        run: |
          manifest=.candidate/output/release/release-manifest.json
          common=(
            --manifest "$manifest"
            --candidate-receipt .candidate/output/candidate-build-receipt.json
            --trusted-public-key "$ECOREX_RELEASE_SIGNER_PUBLIC_KEY"
            --staging-provenance .candidate/input/staging-provenance.json
            --expected-staging-run-id ${{ inputs.staging_run_id }}
            --commit-sha ${{ github.sha }}
            --workflow-run-id ${{ github.run_id }}
            --output-dir .candidate/gates
          )
          python scripts/write-v1-gate-receipts.py --gate lint --gate typecheck --gate unit --gate contract --gate integration --evidence-file .candidate/quality-artifact/.candidate/quality/quality-complete.json "${common[@]}"
          python scripts/write-v1-gate-receipts.py --gate migration-dry-run --evidence-file .candidate/output/migration-release-bound.json --source-evidence .candidate/quality-artifact/.candidate/quality/quality-complete.json "${common[@]}"
          python scripts/write-v1-gate-receipts.py --gate license --gate secret-scan --evidence-file .candidate/quality-artifact/.candidate/quality/supply-chain.json "${common[@]}"
          python scripts/write-v1-gate-receipts.py --gate windows-build --gate macos-build --evidence-file .candidate/output/e2e-release-bound.json --source-evidence .candidate/quality-artifact/.candidate/quality/quality-complete.json "${common[@]}"
          python scripts/write-v1-gate-receipts.py --gate e2e --evidence-file .candidate/output/e2e-release-bound.json --source-evidence .candidate/quality-artifact/.candidate/quality/quality-complete.json "${common[@]}"
          python scripts/write-v1-gate-receipts.py --gate image-shared-storage --evidence-file .candidate/output/image-shared-storage-release-bound.json --source-evidence .candidate/image-evidence/image-shared-storage.json "${common[@]}"
          python scripts/write-v1-gate-receipts.py --gate image-soak --evidence-file .candidate/output/image-soak-release-bound.json --source-evidence .candidate/image-evidence/image-soak.json "${common[@]}"
          python scripts/write-v1-gate-receipts.py --gate reproducibility --evidence-file .candidate/output/reproducibility-release-bound.json --source-evidence .candidate/reproducibility-artifact/reproducibility.json "${common[@]}"
          python scripts/write-v1-gate-receipts.py --gate signature --evidence-file .candidate/output/signature-report.json "${common[@]}"
          python scripts/write-v1-gate-receipts.py --gate sbom --gate size-scan --evidence-file .candidate/output/release-supply-chain.json "${common[@]}"

      - name: Upload immutable Candidate and pre-publication evidence
        id: signed_candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecorex-v1-candidate-${{ inputs.channel }}
          path: |
            .candidate/output
            .candidate/gates
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  cloud-build-unsigned:
    name: Build immutable unsigned Linux cloud runtime
    needs: build-and-sign
    environment:
      name: ecorex-cloud-build
    runs-on: [self-hosted, linux, arm64, ecorex-cloud-build]
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    outputs:
      unsigned_tree_artifact_id: ${{ steps.unsigned_cloud_tree.outputs.artifact-id }}
      unsigned_tree_artifact_sha256: ${{ steps.unsigned_cloud_tree.outputs.artifact-digest }}
      signing_handoff_artifact_id: ${{ steps.cloud_signing_handoff.outputs.artifact-id }}
      signing_handoff_artifact_sha256: ${{ steps.cloud_signing_handoff.outputs.artifact-digest }}
    steps:
      - name: Checkout the exact protected Candidate source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.9"

      - name: Install exact cloud build dependencies
        run: python scripts/install-v1-python-profile.py --profile cloud

      - name: Download the exact signed Candidate identity
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build-and-sign.outputs.candidate_artifact_id }}
          ARTIFACT_SHA256: ${{ needs.build-and-sign.outputs.candidate_artifact_sha256 }}
        run: |
          curl --fail --location --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            --output .candidate.zip \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip"
          python scripts/extract-v1-workflow-artifact.py \
            --archive .candidate.zip \
            --expected-sha256 "$ARTIFACT_SHA256" \
            --output .candidate \
            --required-root output \
            --required-root gates \
            --receipt .candidate/extraction.json

      - name: Build the immutable Linux aarch64 cloud tree
        env:
          ECOREX_CLOUD_BUILD_RELEASE_ROOT: ${{ vars.ECOREX_CLOUD_BUILD_RELEASE_ROOT }}
        run: |
          release_id="$(python -c 'import json; print(json.load(open(".candidate/output/release/release-manifest.json", encoding="utf-8"))["release_id"])')"
          python scripts/build-v1-linux-cloud-artifact.py build \
            --source-root . \
            --artifact-root .cloud/artifact \
            --handoff-root .cloud/handoff \
            --release-id "$release_id" \
            --expected-commit "${{ github.sha }}"
          mkdir -p .cloud/package
          python scripts/build-v1-linux-cloud-artifact.py pack \
            --artifact-root .cloud/artifact \
            --archive .cloud/package/cloud-artifact.tar

      - name: Upload unsigned cloud tree without signing authority
        id: unsigned_cloud_tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecorex-v1-cloud-tree-${{ inputs.channel }}-${{ github.run_id }}
          path: .cloud/package/cloud-artifact.tar
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Upload detached manifest handoff without cloud tree
        id: cloud_signing_handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecorex-v1-cloud-handoff-${{ inputs.channel }}-${{ github.run_id }}
          path: .cloud/handoff
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  cloud-sign:
    name: Sign only the detached cloud manifest
    needs: cloud-build-unsigned
    environment:
      name: ecorex-release-signing-${{ inputs.channel }}
    runs-on: [self-hosted, linux, arm64, ecorex-release-sign]
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      signature_artifact_id: ${{ steps.cloud_signature.outputs.artifact-id }}
      signature_artifact_sha256: ${{ steps.cloud_signature.outputs.artifact-digest }}
    steps:
      - name: Checkout exact signing authority
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.9"

      - name: Install exact signer dependencies
        run: python scripts/install-v1-python-profile.py --profile runtime

      - name: Download exact unsigned handoff by artifact ID and digest
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.cloud-build-unsigned.outputs.signing_handoff_artifact_id }}
          ARTIFACT_SHA256: ${{ needs.cloud-build-unsigned.outputs.signing_handoff_artifact_sha256 }}
        run: |
          curl --fail --location --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            --output .cloud-unsigned.zip \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip"
          python scripts/extract-v1-workflow-artifact.py \
            --archive .cloud-unsigned.zip \
            --expected-sha256 "$ARTIFACT_SHA256" \
            --output .cloud/handoff \
            --required-root cloud-unsigned-signature-descriptor.json \
            --required-root cloud-release-manifest.json \
            --required-root cloud-release-manifest.signing-payload \
            --required-root cloud-build-receipt.json \
            --receipt .cloud/handoff-extraction.json

      - name: Sign detached canonical bytes without executing the artifact
        env:
          ECOREX_RELEASE_SIGNER_EXECUTABLE: ${{ vars.ECOREX_RELEASE_SIGNER_EXECUTABLE }}
          ECOREX_RELEASE_SIGNER_EXECUTABLE_SHA256: ${{ vars.ECOREX_RELEASE_SIGNER_EXECUTABLE_SHA256 }}
          ECOREX_RELEASE_SIGNER_ADAPTER: ${{ vars.ECOREX_RELEASE_SIGNER_ADAPTER }}
          ECOREX_RELEASE_SIGNER_ADAPTER_SHA256: ${{ vars.ECOREX_RELEASE_SIGNER_ADAPTER_SHA256 }}
          ECOREX_RELEASE_SIGNER_KEY_ID: ${{ vars.ECOREX_RELEASE_SIGNER_KEY_ID }}
          ECOREX_RELEASE_SIGNER_PUBLIC_KEY: ${{ vars.ECOREX_RELEASE_SIGNER_PUBLIC_KEY }}
        run: >-
          python scripts/sign-v1-cloud-artifact.py
          --descriptor .cloud/handoff/cloud-unsigned-signature-descriptor.json
          --payload .cloud/handoff/cloud-release-manifest.signing-payload
          --output .cloud/cloud-signature-response.json

      - name: Upload only detached signature response
        id: cloud_signature
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecorex-v1-cloud-signature-${{ inputs.channel }}-${{ github.run_id }}
          path: .cloud/cloud-signature-response.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  cloud-finalize:
    name: Attach and verify signed cloud runtime on isolated builder
    needs:
      - cloud-build-unsigned
      - cloud-sign
    environment:
      name: ecorex-cloud-build
    runs-on: [self-hosted, linux, arm64, ecorex-cloud-build]
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      cloud_artifact_id: ${{ steps.signed_cloud.outputs.artifact-id }}
      cloud_artifact_sha256: ${{ steps.signed_cloud.outputs.artifact-digest }}
    steps:
      - name: Checkout exact finalization authority
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.9"

      - name: Install exact cloud verification dependencies
        run: python scripts/install-v1-python-profile.py --profile cloud

      - name: Download exact unsigned cloud bytes
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.cloud-build-unsigned.outputs.unsigned_tree_artifact_id }}
          ARTIFACT_SHA256: ${{ needs.cloud-build-unsigned.outputs.unsigned_tree_artifact_sha256 }}
        run: |
          curl --fail --location --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            --output .cloud-unsigned.zip \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip"
          python scripts/extract-v1-workflow-artifact.py \
            --archive .cloud-unsigned.zip \
            --expected-sha256 "$ARTIFACT_SHA256" \
            --output .cloud/package \
            --required-root cloud-artifact.tar \
            --receipt .cloud/unsigned-tree-extraction.json
          python scripts/build-v1-linux-cloud-artifact.py unpack \
            --archive .cloud/package/cloud-artifact.tar \
            --artifact-root .cloud/artifact

      - name: Download exact detached manifest handoff
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.cloud-build-unsigned.outputs.signing_handoff_artifact_id }}
          ARTIFACT_SHA256: ${{ needs.cloud-build-unsigned.outputs.signing_handoff_artifact_sha256 }}
        run: |
          curl --fail --location --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            --output .cloud-handoff.zip \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip"
          python scripts/extract-v1-workflow-artifact.py \
            --archive .cloud-handoff.zip \
            --expected-sha256 "$ARTIFACT_SHA256" \
            --output .cloud/handoff \
            --required-root cloud-unsigned-signature-descriptor.json \
            --required-root cloud-release-manifest.json \
            --required-root cloud-release-manifest.signing-payload \
            --required-root cloud-build-receipt.json \
            --receipt .cloud/handoff-extraction.json

      - name: Download exact detached signature response
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.cloud-sign.outputs.signature_artifact_id }}
          ARTIFACT_SHA256: ${{ needs.cloud-sign.outputs.signature_artifact_sha256 }}
        run: |
          mkdir -p .signature
          curl --fail --location --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            --output .cloud-signature.zip \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip"
          python scripts/extract-v1-workflow-artifact.py \
            --archive .cloud-signature.zip \
            --expected-sha256 "$ARTIFACT_SHA256" \
            --output .signature \
            --required-root cloud-signature-response.json \
            --receipt .signature/extraction.json

      - name: Attach signature and reverify complete POSIX tree
        env:
          RELEASE_KEY_ID: ${{ vars.ECOREX_RELEASE_SIGNER_KEY_ID }}
          RELEASE_PUBLIC_KEY: ${{ vars.ECOREX_RELEASE_SIGNER_PUBLIC_KEY }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('.cloud/release-keyring.json').write_text(
              json.dumps({os.environ['RELEASE_KEY_ID']: os.environ['RELEASE_PUBLIC_KEY']}, sort_keys=True),
              encoding='utf-8',
          )
          PY
          python scripts/build-v1-linux-cloud-artifact.py attach \
            --artifact-root .cloud/artifact \
            --handoff-root .cloud/handoff \
            --signature-response .signature/cloud-signature-response.json \
            --release-keyring .cloud/release-keyring.json
          rm .cloud/release-keyring.json

      - name: Upload only finalized signed cloud runtime
        id: signed_cloud
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecorex-v1-cloud-${{ inputs.channel }}-${{ github.run_id }}
          path: .cloud/artifact
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  live-acceptance:
    name: Production model, image and Chrome CDP acceptance
    needs:
      - build-and-sign
      - cloud-finalize
    environment:
      name: ecorex-live-acceptance
    runs-on: [self-hosted, windows, x64, ecorex-live-acceptance]
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout exact protected acceptance authority
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.9"

      - name: Install exact receipt and Candidate verification dependencies
        run: python scripts/install-v1-python-profile.py --profile runtime

      - name: Download the exact signed Candidate before exercising providers
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build-and-sign.outputs.candidate_artifact_id }}
          ARTIFACT_SHA256: ${{ needs.build-and-sign.outputs.candidate_artifact_sha256 }}
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2026-03-10" } `
            -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:ARTIFACT_ID/zip" `
            -OutFile .candidate.zip
          python scripts/extract-v1-workflow-artifact.py `
            --archive .candidate.zip `
            --expected-sha256 $env:ARTIFACT_SHA256 `
            --output .candidate `
            --required-root output `
            --required-root gates `
            --receipt .candidate/extraction.json

      - name: Download the exact signed cloud runtime for the same Candidate
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.cloud-finalize.outputs.cloud_artifact_id }}
          ARTIFACT_SHA256: ${{ needs.cloud-finalize.outputs.cloud_artifact_sha256 }}
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2026-03-10" } `
            -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:ARTIFACT_ID/zip" `
            -OutFile .cloud-signed.zip
          python scripts/extract-v1-workflow-artifact.py `
            --archive .cloud-signed.zip `
            --expected-sha256 $env:ARTIFACT_SHA256 `
            --output .candidate/output/cloud `
            --required-root cloud-release-manifest.json `
            --required-root cloud-release-manifest.sig.json `
            --required-root deployment `
            --required-root venv `
            --receipt .candidate/output/cloud-extraction.json

      - name: Run digest-pinned production acceptance without environment secrets
        env:
          ECOREX_LIVE_ACCEPTANCE_EXECUTABLE: ${{ vars.ECOREX_LIVE_ACCEPTANCE_EXECUTABLE }}
          ECOREX_LIVE_ACCEPTANCE_EXECUTABLE_SHA256: ${{ vars.ECOREX_LIVE_ACCEPTANCE_EXECUTABLE_SHA256 }}
          ECOREX_RELEASE_SIGNER_PUBLIC_KEY: ${{ vars.ECOREX_RELEASE_SIGNER_PUBLIC_KEY }}
        run: >-
          python scripts/run-v1-protected-live-acceptance.py
          --executable "$env:ECOREX_LIVE_ACCEPTANCE_EXECUTABLE"
          --executable-sha256 "$env:ECOREX_LIVE_ACCEPTANCE_EXECUTABLE_SHA256"
          --candidate-root .candidate/output
          --trusted-public-key "$env:ECOREX_RELEASE_SIGNER_PUBLIC_KEY"
          --staging-provenance .candidate/output/evidence/staging-provenance.json
          --expected-staging-run-id ${{ inputs.staging_run_id }}
          --commit-sha ${{ github.sha }}
          --workflow-run-id ${{ github.run_id }}
          --output .candidate/output/live-acceptance-source.json

      - name: Bind live model execution to the signed Candidate
        env:
          ECOREX_RELEASE_SIGNER_PUBLIC_KEY: ${{ vars.ECOREX_RELEASE_SIGNER_PUBLIC_KEY }}
        run: >-
          python scripts/bind-v1-release-gate-evidence.py
          --gate live-model
          --source-evidence .candidate/output/live-acceptance-source.json
          --candidate-receipt .candidate/output/candidate-build-receipt.json
          --release-manifest .candidate/output/release/release-manifest.json
          --trusted-public-key "$env:ECOREX_RELEASE_SIGNER_PUBLIC_KEY"
          --staging-provenance .candidate/output/evidence/staging-provenance.json
          --commit-sha ${{ github.sha }}
          --workflow-run-id ${{ github.run_id }}
          --expected-staging-run-id ${{ inputs.staging_run_id }}
          --output .candidate/output/live-model-release-bound.json

      - name: Bind live image and precise-retouch execution to the signed Candidate
        env:
          ECOREX_RELEASE_SIGNER_PUBLIC_KEY: ${{ vars.ECOREX_RELEASE_SIGNER_PUBLIC_KEY }}
        run: >-
          python scripts/bind-v1-release-gate-evidence.py
          --gate live-image
          --source-evidence .candidate/output/live-acceptance-source.json
          --candidate-receipt .candidate/output/candidate-build-receipt.json
          --release-manifest .candidate/output/release/release-manifest.json
          --trusted-public-key "$env:ECOREX_RELEASE_SIGNER_PUBLIC_KEY"
          --staging-provenance .candidate/output/evidence/staging-provenance.json
          --commit-sha ${{ github.sha }}
          --workflow-run-id ${{ github.run_id }}
          --expected-staging-run-id ${{ inputs.staging_run_id }}
          --output .candidate/output/live-image-release-bound.json

      - name: Bind real-user Chrome CDP execution to the signed Candidate
        env:
          ECOREX_RELEASE_SIGNER_PUBLIC_KEY: ${{ vars.ECOREX_RELEASE_SIGNER_PUBLIC_KEY }}
        run: >-
          python scripts/bind-v1-release-gate-evidence.py
          --gate cdp-acceptance
          --source-evidence .candidate/output/live-acceptance-source.json
          --candidate-receipt .candidate/output/candidate-build-receipt.json
          --release-manifest .candidate/output/release/release-manifest.json
          --trusted-public-key "$env:ECOREX_RELEASE_SIGNER_PUBLIC_KEY"
          --staging-provenance .candidate/output/evidence/staging-provenance.json
          --commit-sha ${{ github.sha }}
          --workflow-run-id ${{ github.run_id }}
          --expected-staging-run-id ${{ inputs.staging_run_id }}
          --output .candidate/output/cdp-acceptance-release-bound.json

      - name: Record the three immutable live acceptance gates
        env:
          ECOREX_RELEASE_SIGNER_PUBLIC_KEY: ${{ vars.ECOREX_RELEASE_SIGNER_PUBLIC_KEY }}
        shell: pwsh
        run: |
          $common = @(
            "--manifest", ".candidate/output/release/release-manifest.json",
            "--candidate-receipt", ".candidate/output/candidate-build-receipt.json",
            "--trusted-public-key", $env:ECOREX_RELEASE_SIGNER_PUBLIC_KEY,
            "--staging-provenance", ".candidate/output/evidence/staging-provenance.json",
            "--expected-staging-run-id", "${{ inputs.staging_run_id }}",
            "--commit-sha", "${{ github.sha }}",
            "--workflow-run-id", "${{ github.run_id }}",
            "--output-dir", ".candidate/gates"
          )
          python scripts/write-v1-gate-receipts.py --gate live-model --evidence-file .candidate/output/live-model-release-bound.json --source-evidence .candidate/output/live-acceptance-source.json @common
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/write-v1-gate-receipts.py --gate live-image --evidence-file .candidate/output/live-image-release-bound.json --source-evidence .candidate/output/live-acceptance-source.json @common
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/write-v1-gate-receipts.py --gate cdp-acceptance --evidence-file .candidate/output/cdp-acceptance-release-bound.json --source-evidence .candidate/output/live-acceptance-source.json @common
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload only the Candidate carrying all required pre-publication gates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecorex-v1-accepted-${{ inputs.channel }}
          path: |
            .candidate/output
            .candidate/gates
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
