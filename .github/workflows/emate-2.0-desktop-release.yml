name: e-Mate 2.0 desktop release

on:
  push:
    branches:
      - codex/e-mate-*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emate-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime:
    name: signed Runtime seed
    if: ${{ github.repository == 'zyfjacksonchen-source/EcoreX' && startsWith(github.ref, 'refs/heads/codex/e-mate-') }}
    runs-on: macos-15
    outputs:
      version: ${{ steps.release_identity.outputs.version }}
    env:
      ECOREX_V1_FEISHU_CONNECTOR_ENABLED: "true"
    steps:
      - name: Check out the exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Resolve the single release identity
        id: release_identity
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          from ecorex import __version__

          package = json.loads(Path("desktop/package.json").read_text())
          branch_version = os.environ["GITHUB_REF_NAME"].removeprefix("codex/e-mate-")
          assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", __version__)
          assert package["version"] == branch_version == __version__
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"version={__version__}\n")
          PY

      - name: Install the pinned Python toolchain
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.9"
          cache: pip

      - name: Install the pinned Node toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install the pinned Go toolchain
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: platform-staging/bootstrap/go.mod

      - name: Build the accepted WebUI once
        run: |
          python scripts/install-v1-python-profile.py --profile runtime
          npm ci --prefix desktop
          npm run build:web --prefix desktop

      - name: Gate the accepted e-Mate source contracts
        run: |
          python scripts/install-v1-python-profile.py --profile dev
          python -m pytest -q -p no:cacheprovider \
            tests/v1/test_public_download_site.py \
            tests/v1/test_emate_desktop_feed.py \
            tests/v1/test_emate_feed_deploy.py \
            tests/v1/test_control_plane_release_replica_service.py \
            tests/v1/test_manual_webui_builder.py \
            tests/v1/test_callback_channel_boundary.py \
            tests/v1/test_workspace_content.py \
            tests/v1/test_cowagent_data_migration.py \
            tests/v1/test_channel_self_service.py \
            tests/v1/test_channel_runtime_dispatcher.py \
            tests/v1/test_channel_terminal_convergence.py \
            tests/v1/test_connector_vault.py \
            tests/v1/test_wechat_callback_gateway.py \
            tests/v1/test_weixin_channel_adapter.py \
            tests/v1/test_dependency_pack_process.py \
            tests/v1/test_office_skill_runtime.py \
            tests/v1/test_release_process_boundary.py \
            tests/v1/test_user_mcp_self_service.py \
            tests/v1/test_mcp_oauth.py \
            tests/v1/test_agent_turn_worker.py \
            tests/v1/test_runtime_composition.py \
            tests/v1/test_usage_projection.py \
            tests/v1/test_device_identity_management.py \
            tests/v1/test_image_orchestrator_production_runtime.py \
            tests/v1/test_server_product_app.py::test_product_composes_message_channels_with_the_agent_runtime \
            tests/v1/test_server_product_app.py::test_product_settings_inject_cloud_authoritative_session
          python scripts/check-v1-public-download-site.py

      - name: Gate the accepted e-Mate interaction contracts
        working-directory: desktop
        run: |
          npm run typecheck
          npm run test:v1
          npx playwright install chromium
          npx playwright test \
            --config=playwright.config.ts \
            e2e/ga-webui.spec.ts

      - name: Fetch pinned predecessor Runtime closure
        run: |
          mkdir -p .runtime/base
          curl --fail --location --retry 3 --output .runtime/base/EcoreX_0.3.2-webui-windows-x64.zip \
            https://github.com/zyfjacksonchen-source/EcoreX-installers/releases/download/v0.3.2/EcoreX_0.3.2-webui-windows-x64.zip
          curl --fail --location --retry 3 --output .runtime/base/EcoreX_0.3.2-webui-macos-universal.zip \
            https://github.com/zyfjacksonchen-source/EcoreX-installers/releases/download/v0.3.2/EcoreX_0.3.2-webui-macos-universal.zip

      - name: Build and verify one signed cross-platform Runtime release
        run: |
          python scripts/build-v1-manual-webui.py \
            --source "$GITHUB_WORKSPACE" \
            --commit-sha "$GITHUB_SHA" \
            --web-dist "$GITHUB_WORKSPACE/desktop/dist" \
            --base-windows "$GITHUB_WORKSPACE/.runtime/base/EcoreX_0.3.2-webui-windows-x64.zip" \
            --base-macos "$GITHUB_WORKSPACE/.runtime/base/EcoreX_0.3.2-webui-macos-universal.zip" \
            --predecessor-trust "$GITHUB_WORKSPACE/release/v1/desktop-predecessor-trust.json" \
            --go "$(command -v go)" \
            --output "$GITHUB_WORKSPACE/.runtime/seed"

      - name: Extract bounded Bootstrap inputs for desktop builders
        run: |
          python - <<'PY'
          import json, pathlib, zipfile
          root = pathlib.Path('.runtime/seed/release')
          manifest = json.loads((root / 'release-manifest.json').read_text())
          targets = ('windows-x64', 'macos-arm64', 'macos-x64')
          for target in targets:
              core = next(value for value in manifest['artifacts'] if value['artifact_id'] == f'core-{target}')
              with zipfile.ZipFile(root / core['file_name']) as archive:
                  runtime_config = json.loads(archive.read('runtime-config.json'))
              assert runtime_config['connectors'] == {
                  'endpoint': 'https://dl.ecoremedia.net/api/v1/connectors',
                  'allowed_hosts': ['dl.ecoremedia.net'],
                  'enabled_connectors': ['feishu'],
              }
              artifact_id = f'bootstrap-{target}'
              item = next(value for value in manifest['artifacts'] if value['artifact_id'] == artifact_id)
              destination = pathlib.Path('.runtime/bootstraps') / target
              destination.mkdir(parents=True)
              with zipfile.ZipFile(root / item['file_name']) as archive:
                  for member in archive.infolist():
                      path = pathlib.PurePosixPath(member.filename)
                      if path.is_absolute() or '..' in path.parts or '\\' in member.filename:
                          raise SystemExit('unsafe Bootstrap archive member')
                  archive.extractall(destination)
          PY

      - name: Upload the signed Runtime handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e-mate-${{ steps.release_identity.outputs.version }}-runtime-seed
          path: |
            .runtime/seed/release
            .runtime/seed/manual-webui-build-receipt.json
            .runtime/bootstraps
          if-no-files-found: error
          retention-days: 14

  build:
    name: ${{ matrix.id }}
    needs: runtime
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            os: windows-2025
            command: npm run dist:win
            runtime_target: windows-x64
            artifact_glob: |
              desktop/release/*.exe
          - id: macos-arm64
            os: macos-15
            command: npm run dist:mac:arm64
            runtime_target: macos-arm64
            artifact_glob: |
              desktop/release/*-arm64.dmg
              desktop/release/*-arm64.zip
          - id: macos-x64
            os: macos-15-intel
            command: npm run dist:mac:x64
            runtime_target: macos-x64
            artifact_glob: |
              desktop/release/*-x64.dmg
              desktop/release/*-x64.zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install the pinned Python toolchain
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.9"
          cache: pip

      - name: Install the pinned Node toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Download the signed Runtime handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e-mate-${{ needs.runtime.outputs.version }}-runtime-seed
          path: .runtime

      - name: Verify accepted UI and release identity
        run: |
          test "$(git rev-parse HEAD:desktop/src/v1)" = "092726f6480376f32b653f1da0a18cd4fd010bf6"
          python - <<'PY'
          import json
          from pathlib import Path
          from ecorex import __version__
          package = json.loads(Path("desktop/package.json").read_text())
          assert __version__ == package["version"] == "${{ needs.runtime.outputs.version }}"
          PY

      - name: Install pinned project inputs
        run: |
          python scripts/install-v1-python-profile.py --profile runtime
          npm ci --prefix desktop

      - name: Gate Windows process isolation
        if: ${{ matrix.id == 'windows-x64' }}
        run: |
          python scripts/install-v1-python-profile.py --profile dev
          python -m pytest -q -p no:cacheprovider \
            tests/v1/test_dependency_pack_process.py \
            tests/v1/test_release_process_boundary.py

      - name: Build unsigned desktop package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          EMATE_RELEASE_DIR: ${{ github.workspace }}/.runtime/seed/release
          EMATE_BOOTSTRAP_DIR: ${{ github.workspace }}/.runtime/bootstraps/${{ matrix.runtime_target }}
        run: ${{ matrix.command }}
        working-directory: desktop

      - name: Reject predecessor brand in source and unpacked product
        run: |
          python scripts/check-emate-brand.py skills ecorex desktop/src desktop/electron desktop/dist
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys
          release = Path("desktop/release")
          roots = [path for path in (release / "win-unpacked",) if path.exists()]
          roots.extend(sorted(release.glob("mac*/*.app")))
          if not roots:
              raise SystemExit("unpacked desktop product missing")
          subprocess.run(
              [sys.executable, "scripts/check-emate-brand.py", "--allow-contained-symlinks", *map(str, roots)],
              check=True,
          )
          PY
          asar_paths="$(mktemp)"
          find desktop/release -type f \( -path '*/Resources/app.asar' -o -path '*/resources/app.asar' \) -print0 |
            while IFS= read -r -d '' archive; do
              "$GITHUB_WORKSPACE/desktop/node_modules/.bin/asar" list "$archive"
            done > "$asar_paths"
          test -s "$asar_paths"
          python scripts/check-emate-brand.py "$asar_paths"
          rm "$asar_paths"

      - name: Give architecture metadata a collision-free handoff name
        if: ${{ startsWith(matrix.id, 'macos-') }}
        env:
          RUNTIME_TARGET: ${{ matrix.runtime_target }}
        run: |
          case "$RUNTIME_TARGET" in
            macos-arm64) arch=arm64 ;;
            macos-x64) arch=x64 ;;
            *) exit 1 ;;
          esac
          mv desktop/release/latest-mac.yml "desktop/release/latest-mac-$arch.yml"

      - name: Record the complete platform handoff checksums
        run: |
          python - <<'PY'
          import glob, hashlib
          from pathlib import Path
          patterns = """${{ matrix.artifact_glob }}
          desktop/release/*.blockmap
          desktop/release/latest*.yml""".splitlines()
          files = sorted({path for pattern in patterns for path in glob.glob(pattern)})
          if not files:
              raise SystemExit("desktop release artifact missing")
          output = Path("desktop/release") / "${{ matrix.id }}.sha256"
          output.write_text("".join(
              f"{hashlib.sha256(Path(path).read_bytes()).hexdigest()}  {Path(path).name}\n"
              for path in files
          ), encoding="utf-8")
          PY

      - name: Upload the platform package handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e-mate-${{ needs.runtime.outputs.version }}-${{ matrix.id }}
          path: |
            ${{ matrix.artifact_glob }}
            desktop/release/*.blockmap
            desktop/release/latest*.yml
            desktop/release/${{ matrix.id }}.sha256
          if-no-files-found: error

  feed-gate:
    name: verify and merge desktop feed
    needs: [runtime, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the feed verifier
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install the pinned Python toolchain
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.9"
          cache: pip

      - name: Install the signed Runtime verifier
        run: python scripts/install-v1-python-profile.py --profile runtime

      - name: Download the Runtime handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e-mate-${{ needs.runtime.outputs.version }}-runtime-seed
          path: .handoff/runtime

      - name: Download the Windows handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e-mate-${{ needs.runtime.outputs.version }}-windows-x64
          path: .handoff/windows-x64

      - name: Download the macOS arm64 handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e-mate-${{ needs.runtime.outputs.version }}-macos-arm64
          path: .handoff/macos-arm64

      - name: Download the macOS x64 handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e-mate-${{ needs.runtime.outputs.version }}-macos-x64
          path: .handoff/macos-x64

      - name: Verify exact bytes and create one collision-free feed receipt
        run: |
          python scripts/prepare-emate-desktop-feed.py \
            --runtime-root .handoff/runtime \
            --windows-root .handoff/windows-x64 \
            --macos-arm64-root .handoff/macos-arm64 \
            --macos-x64-root .handoff/macos-x64 \
            --nginx-config deploy/e-mate/nginx/update-feed.conf \
            --output .handoff/feed \
            --expected-version "${{ needs.runtime.outputs.version }}" \
            --expected-source-sha "$GITHUB_SHA"
          python -c "import json; value=json.load(open('.handoff/feed/feed-stage-receipt.json')); assert value['status'] == 'awaiting-public-bootstrap-index'"

      - name: Upload the verified feed receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e-mate-${{ needs.runtime.outputs.version }}-feed-gate
          path: |
            .handoff/feed/latest.yml
            .handoff/feed/latest-mac.yml
            .handoff/feed/feed-stage-receipt.json
          if-no-files-found: error
          retention-days: 14
