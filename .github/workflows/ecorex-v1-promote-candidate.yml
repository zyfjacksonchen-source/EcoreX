name: EcoreX v1 publish accepted Candidate

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Exact channel carried by the accepted Candidate
        required: true
        type: choice
        default: canary
        options:
          - canary
          - stable
      candidate_run_id:
        description: Successful protected Candidate workflow run ID
        required: true
        type: string
      candidate_run_attempt:
        description: Exact successful Candidate workflow attempt
        required: true
        type: string
      candidate_artifact_id:
        description: Exact ecorex-v1-accepted-* artifact ID from that attempt
        required: true
        type: string
      publication_mode:
        description: Verify only, create a paused rollout, or create and activate it
        required: true
        type: choice
        default: verify-only
        options:
          - verify-only
          - create
          - create-and-activate
      rollout_percentage:
        description: Initial rollout percentage (defaults to 1%)
        required: true
        type: string
        default: "1"

permissions:
  contents: read

concurrency:
  group: ecorex-v1-publication-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  validate-request:
    name: Authenticate immutable accepted Candidate handoff
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      publication_artifact_id: ${{ steps.publication_input.outputs.artifact-id }}
      publication_artifact_sha256: ${{ steps.publication_input.outputs.artifact-digest }}
    steps:
      - name: Refuse PR, unprotected ref or malformed publication identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_PROTECTED: ${{ github.ref_protected }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          ROLLOUT_PERCENTAGE: ${{ inputs.rollout_percentage }}
        run: |
          python - <<'PY'
          import os, re
          ok = (
              os.environ["EVENT_NAME"] == "workflow_dispatch"
              and os.environ["REF_PROTECTED"] == "true"
              and re.fullmatch(r"[1-9][0-9]{0,18}", os.environ["CANDIDATE_RUN_ID"] or "")
              and re.fullmatch(r"[1-9][0-9]{0,8}", os.environ["CANDIDATE_RUN_ATTEMPT"] or "")
              and re.fullmatch(r"[1-9][0-9]{0,18}", os.environ["CANDIDATE_ARTIFACT_ID"] or "")
              and re.fullmatch(r"(?:[1-9]|[1-9][0-9]|100)", os.environ["ROLLOUT_PERCENTAGE"] or "")
          )
          raise SystemExit(0 if ok else 1)
          PY

      - name: Checkout exact protected publication authority
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.9"

      - name: Install exact Candidate verification dependencies
        run: python scripts/install-v1-python-profile.py --profile runtime

      - name: Read exact Candidate attempt and artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
        run: |
          mkdir -p .handoff
          gh api --header "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}/attempts/${CANDIDATE_RUN_ATTEMPT}" \
            > .handoff/run.json
          gh api --header "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}/artifacts?per_page=100" \
            > .handoff/artifacts.json

      - name: Select only the exact live-accepted artifact ID
        id: candidate
        run: >-
          python scripts/select-v1-accepted-candidate.py
          --run-metadata .handoff/run.json
          --artifact-metadata .handoff/artifacts.json
          --repository "${GITHUB_REPOSITORY}"
          --commit-sha "${GITHUB_SHA}"
          --workflow-run-id "${{ inputs.candidate_run_id }}"
          --run-attempt "${{ inputs.candidate_run_attempt }}"
          --artifact-id "${{ inputs.candidate_artifact_id }}"
          --channel "${{ inputs.channel }}"
          --protected-ref refs/heads/main
          --max-run-age-seconds 2592000
          --output .handoff/candidate-handoff.json
          --github-output "${GITHUB_OUTPUT}"

      - name: Download exact archive bytes and fail on any digest mismatch
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ARTIFACT_ID: ${{ steps.candidate.outputs.artifact_id }}
          CANDIDATE_ARTIFACT_SHA256: ${{ steps.candidate.outputs.artifact_sha256 }}
        run: |
          curl --fail --location --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            --output .handoff/candidate.zip \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE_ARTIFACT_ID}/zip"
          python scripts/extract-v1-workflow-artifact.py \
            --archive .handoff/candidate.zip \
            --expected-sha256 "$CANDIDATE_ARTIFACT_SHA256" \
            --output .candidate \
            --required-root output \
            --required-root gates \
            --receipt .handoff/candidate-extraction.json

      - name: Re-authenticate signed Candidate and every pre-publication gate
        env:
          ECOREX_RELEASE_SIGNER_PUBLIC_KEY: ${{ vars.ECOREX_RELEASE_SIGNER_PUBLIC_KEY }}
        run: >-
          python scripts/verify-v1-accepted-candidate.py
          --candidate-root .candidate
          --handoff .handoff/candidate-handoff.json
          --repository "${GITHUB_REPOSITORY}"
          --commit-sha "${GITHUB_SHA}"
          --workflow-run-id "${{ inputs.candidate_run_id }}"
          --run-attempt "${{ inputs.candidate_run_attempt }}"
          --artifact-id "${{ inputs.candidate_artifact_id }}"
          --channel "${{ inputs.channel }}"
          --trusted-public-key "$ECOREX_RELEASE_SIGNER_PUBLIC_KEY"
          --output .candidate/output/candidate-handoff-verification.json

      - name: Independently verify all release file signatures and supply-chain evidence
        env:
          ECOREX_RELEASE_SIGNER_KEY_ID: ${{ vars.ECOREX_RELEASE_SIGNER_KEY_ID }}
          ECOREX_RELEASE_SIGNER_PUBLIC_KEY: ${{ vars.ECOREX_RELEASE_SIGNER_PUBLIC_KEY }}
        run: |
          python scripts/verify-v1-release-signatures.py \
            --release-dir .candidate/output/release \
            --report .candidate/output/candidate-handoff-signature-report.json
          python scripts/check-v1-candidate-supply-chain.py release \
            --release-dir .candidate/output/release \
            --dependency-lock-manifest requirements/locks/manifest.json \
            --report .candidate/output/candidate-handoff-supply-chain.json
          cp .handoff/candidate-handoff.json .candidate/output/evidence/candidate-handoff.json
          cp .handoff/candidate-extraction.json .candidate/output/evidence/candidate-extraction.json

      - name: Upload exact verified publication input for protected approval
        id: publication_input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecorex-v1-publication-input-${{ inputs.channel }}-${{ github.run_id }}
          path: |
            .candidate/output
            .candidate/gates
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  publish-and-promote:
    name: Publish exact bytes and apply administrator rollout decision
    if: ${{ inputs.publication_mode != 'verify-only' }}
    needs: validate-request
    environment:
      name: ecorex-release-publication-${{ inputs.channel }}
    runs-on: [self-hosted, linux, arm64, ecorex-release-publish]
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
      id-token: write
    outputs:
      result_artifact_id: ${{ steps.publication_result.outputs.artifact-id }}
      result_artifact_sha256: ${{ steps.publication_result.outputs.artifact-digest }}
    steps:
      - name: Checkout exact protected publication authority
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.9"

      - name: Install runner-only publication dependencies
        run: python scripts/install-v1-python-profile.py --profile runtime

      - name: Download verified input bytes and fail on any digest mismatch
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_ARTIFACT_ID: ${{ needs.validate-request.outputs.publication_artifact_id }}
          PUBLICATION_ARTIFACT_SHA256: ${{ needs.validate-request.outputs.publication_artifact_sha256 }}
        run: |
          curl --fail --location --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            --output .publication-input.zip \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PUBLICATION_ARTIFACT_ID}/zip"
          python scripts/extract-v1-workflow-artifact.py \
            --archive .publication-input.zip \
            --expected-sha256 "$PUBLICATION_ARTIFACT_SHA256" \
            --output .candidate \
            --required-root output \
            --required-root gates \
            --receipt .publication-input-extraction.json

      - name: Re-authenticate handoff and Candidate at the mutation boundary
        env:
          ECOREX_RELEASE_SIGNER_PUBLIC_KEY: ${{ vars.ECOREX_RELEASE_SIGNER_PUBLIC_KEY }}
        run: >-
          python scripts/verify-v1-accepted-candidate.py
          --candidate-root .candidate
          --handoff .candidate/output/evidence/candidate-handoff.json
          --repository "${GITHUB_REPOSITORY}"
          --commit-sha "${GITHUB_SHA}"
          --workflow-run-id "${{ inputs.candidate_run_id }}"
          --run-attempt "${{ inputs.candidate_run_attempt }}"
          --artifact-id "${{ inputs.candidate_artifact_id }}"
          --channel "${{ inputs.channel }}"
          --trusted-public-key "$ECOREX_RELEASE_SIGNER_PUBLIC_KEY"
          --output .candidate/output/candidate-publication-verification.json

      - name: Retain exact publication-input extraction identity
        run: >-
          cp .publication-input-extraction.json
          .candidate/output/evidence/publication-input-extraction.json

      - name: Publish the required primary source (Stable) or all sources (Canary)
        env:
          ECOREX_GITHUB_RELEASE_TOKEN: ${{ secrets.ECOREX_GITHUB_RELEASE_TOKEN }}
          ECOREX_CDN_TOKEN: ${{ secrets.ECOREX_CDN_TOKEN }}
          ECOREX_RELEASE_MIRROR_TOKEN: ${{ secrets.ECOREX_RELEASE_MIRROR_TOKEN }}
          KEY_ID: ${{ vars.ECOREX_RELEASE_SIGNER_KEY_ID }}
          PUBLIC_KEY: ${{ vars.ECOREX_RELEASE_SIGNER_PUBLIC_KEY }}
          PUBLICATION_CONFIG: ${{ vars.ECOREX_RELEASE_PUBLICATION_CONFIG }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          args=(
            publish-assets
            --release-dir .candidate/output/release
            --publication-config "$PUBLICATION_CONFIG"
            --receipt .candidate/output/publication-receipt.json
            --trusted-key "$KEY_ID=$PUBLIC_KEY"
          )
          if [[ "$RELEASE_CHANNEL" == "canary" ]]; then
            args+=(--publish-github)
          fi
          ecorex-release "${args[@]}"

      - name: Reproduce the stable public Bootstrap discovery bytes
        if: ${{ inputs.channel == 'stable' }}
        env:
          ECOREX_RELEASE_SIGNER_EXECUTABLE: ${{ vars.ECOREX_RELEASE_SIGNER_EXECUTABLE }}
          ECOREX_RELEASE_SIGNER_EXECUTABLE_SHA256: ${{ vars.ECOREX_RELEASE_SIGNER_EXECUTABLE_SHA256 }}
          ECOREX_RELEASE_SIGNER_ADAPTER: ${{ vars.ECOREX_RELEASE_SIGNER_ADAPTER }}
          ECOREX_RELEASE_SIGNER_ADAPTER_SHA256: ${{ vars.ECOREX_RELEASE_SIGNER_ADAPTER_SHA256 }}
          ECOREX_RELEASE_SIGNER_KEY_ID: ${{ vars.ECOREX_RELEASE_SIGNER_KEY_ID }}
          ECOREX_RELEASE_SIGNER_PUBLIC_KEY: ${{ vars.ECOREX_RELEASE_SIGNER_PUBLIC_KEY }}
          ECOREX_PUBLICATION_SIGNER_EXECUTABLE: ${{ vars.ECOREX_PUBLICATION_SIGNER_EXECUTABLE }}
          ECOREX_PUBLICATION_SIGNER_EXECUTABLE_SHA256: ${{ vars.ECOREX_PUBLICATION_SIGNER_EXECUTABLE_SHA256 }}
          ECOREX_PUBLICATION_SIGNER_ADAPTER: ${{ vars.ECOREX_PUBLICATION_SIGNER_ADAPTER }}
          ECOREX_PUBLICATION_SIGNER_ADAPTER_SHA256: ${{ vars.ECOREX_PUBLICATION_SIGNER_ADAPTER_SHA256 }}
          ECOREX_PUBLICATION_SIGNER_KEY_ID: ${{ vars.ECOREX_PUBLICATION_SIGNER_KEY_ID }}
          ECOREX_PUBLICATION_SIGNER_PUBLIC_KEY: ${{ vars.ECOREX_PUBLICATION_SIGNER_PUBLIC_KEY }}
          KEY_ID: ${{ vars.ECOREX_RELEASE_SIGNER_KEY_ID }}
          PUBLIC_KEY: ${{ vars.ECOREX_RELEASE_SIGNER_PUBLIC_KEY }}
          PUBLICATION_KEY_ID: ${{ vars.ECOREX_PUBLICATION_SIGNER_KEY_ID }}
          PUBLICATION_PUBLIC_KEY: ${{ vars.ECOREX_PUBLICATION_SIGNER_PUBLIC_KEY }}
        run: >-
          ecorex-release build-public-bootstrap-index
          --release-dir .candidate/output/release
          --publication-receipt .candidate/output/publication-receipt.json
          --output .candidate/output/public-bootstrap-index.json
          --trusted-key "$KEY_ID=$PUBLIC_KEY"
          --trusted-publication-key "$PUBLICATION_KEY_ID=$PUBLICATION_PUBLIC_KEY"

      - name: Stage the stable Bootstrap index without changing public authority
        if: ${{ inputs.channel == 'stable' }}
        env:
          ECOREX_BOOTSTRAP_INDEX_TOKEN: ${{ secrets.ECOREX_BOOTSTRAP_INDEX_TOKEN }}
          KEY_ID: ${{ vars.ECOREX_RELEASE_SIGNER_KEY_ID }}
          PUBLIC_KEY: ${{ vars.ECOREX_RELEASE_SIGNER_PUBLIC_KEY }}
          PUBLICATION_KEY_ID: ${{ vars.ECOREX_PUBLICATION_SIGNER_KEY_ID }}
          PUBLICATION_PUBLIC_KEY: ${{ vars.ECOREX_PUBLICATION_SIGNER_PUBLIC_KEY }}
          BOOTSTRAP_INDEX_PUBLICATION_CONFIG: ${{ vars.ECOREX_BOOTSTRAP_INDEX_PUBLICATION_CONFIG }}
        run: >-
          ecorex-release stage-public-bootstrap-index
          --release-dir .candidate/output/release
          --publication-receipt .candidate/output/publication-receipt.json
          --index .candidate/output/public-bootstrap-index.json
          --publication-config "$BOOTSTRAP_INDEX_PUBLICATION_CONFIG"
          --receipt .candidate/output/bootstrap-index-stage-receipt.json
          --trusted-key "$KEY_ID=$PUBLIC_KEY"
          --trusted-publication-key "$PUBLICATION_KEY_ID=$PUBLICATION_PUBLIC_KEY"

      - name: Assemble exact channel-specific preparation evidence
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          args=(
            --receipts-dir .candidate/gates
            --manifest .candidate/output/release/release-manifest.json
            --publication-receipt .candidate/output/publication-receipt.json
            --expected-commit ${{ github.sha }}
            --expected-workflow-run-id ${{ inputs.candidate_run_id }}
          )
          if [[ "$RELEASE_CHANNEL" == "stable" ]]; then
            args+=(--phase prepare --output .candidate/output/release-evidence-prepare-unsigned.json)
          else
            args+=(--phase finalize --output .candidate/output/release-evidence-unsigned.json)
          fi
          python scripts/assemble-v1-release-evidence.py "${args[@]}"

      - name: Sign the exact Candidate-bound gate bundle
        env:
          ECOREX_RELEASE_SIGNER_EXECUTABLE: ${{ vars.ECOREX_RELEASE_SIGNER_EXECUTABLE }}
          ECOREX_RELEASE_SIGNER_EXECUTABLE_SHA256: ${{ vars.ECOREX_RELEASE_SIGNER_EXECUTABLE_SHA256 }}
          ECOREX_RELEASE_SIGNER_ADAPTER: ${{ vars.ECOREX_RELEASE_SIGNER_ADAPTER }}
          ECOREX_RELEASE_SIGNER_ADAPTER_SHA256: ${{ vars.ECOREX_RELEASE_SIGNER_ADAPTER_SHA256 }}
          ECOREX_RELEASE_SIGNER_KEY_ID: ${{ vars.ECOREX_RELEASE_SIGNER_KEY_ID }}
          ECOREX_RELEASE_SIGNER_PUBLIC_KEY: ${{ vars.ECOREX_RELEASE_SIGNER_PUBLIC_KEY }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          if [[ "$RELEASE_CHANNEL" == "stable" ]]; then
            unsigned=.candidate/output/release-evidence-prepare-unsigned.json
            output=.candidate/output/release-evidence-prepare.json
          else
            unsigned=.candidate/output/release-evidence-unsigned.json
            output=.candidate/output/release-evidence.json
          fi
          python scripts/sign-v1-release-gate-bundle.py \
            --unsigned "$unsigned" \
            --manifest .candidate/output/release/release-manifest.json \
            --output "$output"

      - name: Create stable candidate gates and paused draft rollout
        if: ${{ inputs.channel == 'stable' }}
        env:
          ECOREX_CONTROL_PLANE_URL: ${{ vars.ECOREX_CONTROL_PLANE_URL }}
          ECOREX_CONTROL_PLANE_HOSTS: ${{ vars.ECOREX_CONTROL_PLANE_HOSTS }}
          ECOREX_CONTROL_PLANE_TOKEN: ${{ secrets.ECOREX_CONTROL_PLANE_TOKEN }}
          KEY_ID: ${{ vars.ECOREX_RELEASE_SIGNER_KEY_ID }}
          PUBLIC_KEY: ${{ vars.ECOREX_RELEASE_SIGNER_PUBLIC_KEY }}
        run: >-
          ecorex-release promote
          --phase prepare
          --manifest .candidate/output/release/release-manifest.json
          --evidence .candidate/output/release-evidence-prepare.json
          --publication-receipt .candidate/output/publication-receipt.json
          --trusted-key "$KEY_ID=$PUBLIC_KEY"
          --journal .candidate/output/promotion-journal.json
          --percentage "${{ inputs.rollout_percentage }}"

      - name: Create paused canary rollout
        if: ${{ inputs.channel == 'canary' }}
        env:
          ECOREX_CONTROL_PLANE_URL: ${{ vars.ECOREX_CONTROL_PLANE_URL }}
          ECOREX_CONTROL_PLANE_HOSTS: ${{ vars.ECOREX_CONTROL_PLANE_HOSTS }}
          ECOREX_CONTROL_PLANE_TOKEN: ${{ secrets.ECOREX_CONTROL_PLANE_TOKEN }}
          KEY_ID: ${{ vars.ECOREX_RELEASE_SIGNER_KEY_ID }}
          PUBLIC_KEY: ${{ vars.ECOREX_RELEASE_SIGNER_PUBLIC_KEY }}
        run: |
          args=(
            promote --phase auto
            --manifest .candidate/output/release/release-manifest.json
            --evidence .candidate/output/release-evidence.json
            --publication-receipt .candidate/output/publication-receipt.json
            --trusted-key "$KEY_ID=$PUBLIC_KEY"
            --journal .candidate/output/promotion-journal.json
            --percentage "${{ inputs.rollout_percentage }}"
          )
          ecorex-release "${args[@]}"

      - name: Defer stable Bootstrap activation to admitted production job
        if: ${{ false }}
        env:
          ECOREX_BOOTSTRAP_INDEX_TOKEN: ${{ secrets.ECOREX_BOOTSTRAP_INDEX_TOKEN }}
          KEY_ID: ${{ vars.ECOREX_RELEASE_SIGNER_KEY_ID }}
          PUBLIC_KEY: ${{ vars.ECOREX_RELEASE_SIGNER_PUBLIC_KEY }}
          PUBLICATION_KEY_ID: ${{ vars.ECOREX_PUBLICATION_SIGNER_KEY_ID }}
          PUBLICATION_PUBLIC_KEY: ${{ vars.ECOREX_PUBLICATION_SIGNER_PUBLIC_KEY }}
          BOOTSTRAP_INDEX_PUBLICATION_CONFIG: ${{ vars.ECOREX_BOOTSTRAP_INDEX_PUBLICATION_CONFIG }}
        run: >-
          ecorex-release activate-public-bootstrap-index
          --release-dir .candidate/output/release
          --publication-receipt .candidate/output/publication-receipt.json
          --index .candidate/output/public-bootstrap-index.json
          --stage-receipt .candidate/output/bootstrap-index-stage-receipt.json
          --publication-config "$BOOTSTRAP_INDEX_PUBLICATION_CONFIG"
          --receipt .candidate/output/bootstrap-index-publication-receipt.json
          --trusted-key "$KEY_ID=$PUBLIC_KEY"
          --trusted-publication-key "$PUBLICATION_KEY_ID=$PUBLICATION_PUBLIC_KEY"

      - name: Defer stable final evidence to admitted production job
        if: ${{ false }}
        run: >-
          python scripts/assemble-v1-release-evidence.py
          --phase finalize
          --receipts-dir .candidate/gates
          --manifest .candidate/output/release/release-manifest.json
          --publication-receipt .candidate/output/publication-receipt.json
          --bootstrap-index-receipt .candidate/output/bootstrap-index-publication-receipt.json
          --expected-commit ${{ github.sha }}
          --expected-workflow-run-id ${{ inputs.candidate_run_id }}
          --output .candidate/output/release-evidence-unsigned.json

      - name: Defer stable final evidence signing to admitted production job
        if: ${{ false }}
        env:
          ECOREX_RELEASE_SIGNER_EXECUTABLE: ${{ vars.ECOREX_RELEASE_SIGNER_EXECUTABLE }}
          ECOREX_RELEASE_SIGNER_EXECUTABLE_SHA256: ${{ vars.ECOREX_RELEASE_SIGNER_EXECUTABLE_SHA256 }}
          ECOREX_RELEASE_SIGNER_ADAPTER: ${{ vars.ECOREX_RELEASE_SIGNER_ADAPTER }}
          ECOREX_RELEASE_SIGNER_ADAPTER_SHA256: ${{ vars.ECOREX_RELEASE_SIGNER_ADAPTER_SHA256 }}
          ECOREX_RELEASE_SIGNER_KEY_ID: ${{ vars.ECOREX_RELEASE_SIGNER_KEY_ID }}
          ECOREX_RELEASE_SIGNER_PUBLIC_KEY: ${{ vars.ECOREX_RELEASE_SIGNER_PUBLIC_KEY }}
        run: >-
          python scripts/sign-v1-release-gate-bundle.py
          --unsigned .candidate/output/release-evidence-unsigned.json
          --manifest .candidate/output/release/release-manifest.json
          --output .candidate/output/release-evidence.json

      - name: Defer stable rollout activation to admitted production job
        if: ${{ false }}
        env:
          ECOREX_CONTROL_PLANE_URL: ${{ vars.ECOREX_CONTROL_PLANE_URL }}
          ECOREX_CONTROL_PLANE_HOSTS: ${{ vars.ECOREX_CONTROL_PLANE_HOSTS }}
          ECOREX_CONTROL_PLANE_TOKEN: ${{ secrets.ECOREX_CONTROL_PLANE_TOKEN }}
          KEY_ID: ${{ vars.ECOREX_RELEASE_SIGNER_KEY_ID }}
          PUBLIC_KEY: ${{ vars.ECOREX_RELEASE_SIGNER_PUBLIC_KEY }}
        run: >-
          ecorex-release promote
          --phase finalize
          --manifest .candidate/output/release/release-manifest.json
          --evidence .candidate/output/release-evidence.json
          --publication-receipt .candidate/output/publication-receipt.json
          --bootstrap-index-receipt .candidate/output/bootstrap-index-publication-receipt.json
          --trusted-key "$KEY_ID=$PUBLIC_KEY"
          --journal .candidate/output/promotion-journal.json
          --percentage "${{ inputs.rollout_percentage }}"
          --activate

      - name: Retain publication receipts, signed evidence and recovery journal
        if: ${{ always() }}
        id: publication_result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecorex-v1-publication-result-${{ inputs.channel }}-${{ github.run_id }}
          path: |
            .candidate/output
            .candidate/gates
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 90

  authorize-production:
    name: Authorize exact prepared bytes for production
    if: ${{ inputs.publication_mode != 'verify-only' }}
    needs:
      - validate-request
      - publish-and-promote
    environment:
      name: ecorex-deployment-authorization
    runs-on: [self-hosted, linux, arm64, ecorex-deployment-authorize]
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      deployment_artifact_id: ${{ steps.authorized_deployment.outputs.artifact-id }}
      deployment_artifact_sha256: ${{ steps.authorized_deployment.outputs.artifact-digest }}
    steps:
      - name: Checkout the exact protected deployment authority
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.9"

      - name: Download exact prepared publication result
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.publish-and-promote.outputs.result_artifact_id }}
          ARTIFACT_SHA256: ${{ needs.publish-and-promote.outputs.result_artifact_sha256 }}
        run: |
          curl --fail --location --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            --output .publication-result.zip \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip"
          python scripts/extract-v1-workflow-artifact.py \
            --archive .publication-result.zip \
            --expected-sha256 "$ARTIFACT_SHA256" \
            --output .candidate \
            --required-root output \
            --required-root gates \
            --receipt .candidate/publication-result-extraction.json

      - name: Materialize the exact public-site input tree
        run: |
          release_id="$(python -c 'import json; print(json.load(open(".candidate/output/release/release-manifest.json"))["release_id"])')"
          mkdir -p ".candidate/site-staging/$release_id"
          cp -a deploy/ecorex-site ".candidate/site-staging/$release_id/site"
          cp .candidate/output/public-bootstrap-index.json \
            ".candidate/site-staging/$release_id/site/public-bootstrap-index.json"

      - name: Assemble immutable production identity and administrator decision
        env:
          CANDIDATE_ARTIFACT_SHA256: ${{ needs.validate-request.outputs.publication_artifact_sha256 }}
        run: >-
          python scripts/assemble-v1-protected-deployment-admission.py
          --candidate-root .candidate
          --site-root ".candidate/site-staging/$(python -c 'import json; print(json.load(open(\".candidate/output/release/release-manifest.json\"))[\"release_id\"])')/site"
          --repository "${GITHUB_REPOSITORY}"
          --commit-sha "${GITHUB_SHA}"
          --channel "${{ inputs.channel }}"
          --candidate-run-id "${{ inputs.candidate_run_id }}"
          --candidate-run-attempt "${{ inputs.candidate_run_attempt }}"
          --candidate-artifact-id "${{ inputs.candidate_artifact_id }}"
          --candidate-artifact-sha256 "$CANDIDATE_ARTIFACT_SHA256"
          --mode "${{ inputs.publication_mode }}"
          --rollout-percentage "${{ inputs.rollout_percentage }}"
          --output .candidate/protected-deployment-admission-unsigned.json

      - name: Sign and self-verify protected deployment admission
        env:
          ECOREX_DEPLOYMENT_SIGNER_EXECUTABLE: ${{ vars.ECOREX_DEPLOYMENT_SIGNER_EXECUTABLE }}
          ECOREX_DEPLOYMENT_SIGNER_EXECUTABLE_SHA256: ${{ vars.ECOREX_DEPLOYMENT_SIGNER_EXECUTABLE_SHA256 }}
          ECOREX_DEPLOYMENT_SIGNER_ADAPTER: ${{ vars.ECOREX_DEPLOYMENT_SIGNER_ADAPTER }}
          ECOREX_DEPLOYMENT_SIGNER_ADAPTER_SHA256: ${{ vars.ECOREX_DEPLOYMENT_SIGNER_ADAPTER_SHA256 }}
          ECOREX_DEPLOYMENT_SIGNER_KEY_ID: ${{ vars.ECOREX_DEPLOYMENT_SIGNER_KEY_ID }}
          ECOREX_DEPLOYMENT_SIGNER_PUBLIC_KEY: ${{ vars.ECOREX_DEPLOYMENT_SIGNER_PUBLIC_KEY }}
        run: >-
          python scripts/sign-v1-protected-deployment-admission.py
          --unsigned .candidate/protected-deployment-admission-unsigned.json
          --output .candidate/protected-deployment-admission.json

      - name: Bind admission and sign public-site authorization v2
        env:
          ECOREX_RELEASE_SIGNER_EXECUTABLE: ${{ vars.ECOREX_RELEASE_SIGNER_EXECUTABLE }}
          ECOREX_RELEASE_SIGNER_EXECUTABLE_SHA256: ${{ vars.ECOREX_RELEASE_SIGNER_EXECUTABLE_SHA256 }}
          ECOREX_RELEASE_SIGNER_ADAPTER: ${{ vars.ECOREX_RELEASE_SIGNER_ADAPTER }}
          ECOREX_RELEASE_SIGNER_ADAPTER_SHA256: ${{ vars.ECOREX_RELEASE_SIGNER_ADAPTER_SHA256 }}
          ECOREX_RELEASE_SIGNER_KEY_ID: ${{ vars.ECOREX_RELEASE_SIGNER_KEY_ID }}
          ECOREX_RELEASE_SIGNER_PUBLIC_KEY: ${{ vars.ECOREX_RELEASE_SIGNER_PUBLIC_KEY }}
          ECOREX_DEPLOYMENT_SIGNER_KEY_ID: ${{ vars.ECOREX_DEPLOYMENT_SIGNER_KEY_ID }}
          ECOREX_DEPLOYMENT_SIGNER_PUBLIC_KEY: ${{ vars.ECOREX_DEPLOYMENT_SIGNER_PUBLIC_KEY }}
        run: |
          release_id="$(python -c 'import json; print(json.load(open(".candidate/output/release/release-manifest.json"))["release_id"])')"
          release_stage=".candidate/site-staging/$release_id"
          cp .candidate/protected-deployment-admission.json \
            "$release_stage/protected-deployment-admission.json"
          python scripts/sign-v1-public-site-deployment.py \
            --release-id "$release_id" \
            --staging-release-dir "$release_stage" \
            --cloud-artifact-root .candidate/output/cloud \
            --protected-admission "$release_stage/protected-deployment-admission.json"

      - name: Upload only exact prepared bytes and their signed admission
        id: authorized_deployment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecorex-v1-authorized-deployment-${{ inputs.channel }}-${{ github.run_id }}
          path: |
            .candidate/output
            .candidate/gates
            .candidate/site-staging
            .candidate/protected-deployment-admission.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  deploy-production:
    name: Deploy admitted cloud, public site and rollout
    if: ${{ inputs.publication_mode == 'create-and-activate' }}
    needs: authorize-production
    environment:
      name: ecorex-production-deployment-${{ inputs.channel }}
    runs-on: [self-hosted, linux, arm64, ecorex-production-deploy]
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    outputs:
      deployment_result_artifact_id: ${{ steps.production_deployment.outputs.artifact-id }}
      deployment_result_artifact_sha256: ${{ steps.production_deployment.outputs.artifact-digest }}
    steps:
      - name: Checkout immutable production executor
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.9"

      - name: Download only the admitted production bundle
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.authorize-production.outputs.deployment_artifact_id }}
          ARTIFACT_SHA256: ${{ needs.authorize-production.outputs.deployment_artifact_sha256 }}
        run: |
          curl --fail --location --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            --output .authorized-deployment.zip \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip"
          python scripts/extract-v1-workflow-artifact.py \
            --archive .authorized-deployment.zip \
            --expected-sha256 "$ARTIFACT_SHA256" \
            --output .deployment \
            --required-root output \
            --required-root gates \
            --required-root site-staging \
            --required-root protected-deployment-admission.json \
            --receipt .deployment/authorized-deployment-extraction.json

      - name: Re-authenticate admission at the mutation boundary
        env:
          KEY_ID: ${{ vars.ECOREX_DEPLOYMENT_SIGNER_KEY_ID }}
          PUBLIC_KEY: ${{ vars.ECOREX_DEPLOYMENT_SIGNER_PUBLIC_KEY }}
        run: >-
          python scripts/verify-v1-protected-deployment-admission.py
          --admission .deployment/protected-deployment-admission.json
          --trusted-key "$KEY_ID=$PUBLIC_KEY"
          --repository "${GITHUB_REPOSITORY}"
          --commit-sha "${GITHUB_SHA}"
          --candidate-run-id "${{ inputs.candidate_run_id }}"
          --candidate-artifact-id "${{ inputs.candidate_artifact_id }}"
          --channel "${{ inputs.channel }}"
          --mode "${{ inputs.publication_mode }}"
          --rollout-percentage "${{ inputs.rollout_percentage }}"

      - name: Execute server-local atomic cloud and public-site authorities
        env:
          ECOREX_PRODUCTION_CLOUD_SPEC: ${{ vars.ECOREX_PRODUCTION_CLOUD_SPEC }}
          ECOREX_PRODUCTION_PUBLIC_SITE_ROOT: ${{ vars.ECOREX_PRODUCTION_PUBLIC_SITE_ROOT }}
          ECOREX_BOOTSTRAP_INDEX_TOKEN: ${{ secrets.ECOREX_BOOTSTRAP_INDEX_TOKEN }}
          ECOREX_CONTROL_PLANE_TOKEN: ${{ secrets.ECOREX_CONTROL_PLANE_TOKEN }}
          ECOREX_CONTROL_PLANE_URL: ${{ vars.ECOREX_CONTROL_PLANE_URL }}
          ECOREX_CONTROL_PLANE_HOSTS: ${{ vars.ECOREX_CONTROL_PLANE_HOSTS }}
          BOOTSTRAP_INDEX_PUBLICATION_CONFIG: ${{ vars.ECOREX_BOOTSTRAP_INDEX_PUBLICATION_CONFIG }}
          KEY_ID: ${{ vars.ECOREX_RELEASE_SIGNER_KEY_ID }}
          PUBLIC_KEY: ${{ vars.ECOREX_RELEASE_SIGNER_PUBLIC_KEY }}
          PUBLICATION_KEY_ID: ${{ vars.ECOREX_PUBLICATION_SIGNER_KEY_ID }}
          PUBLICATION_PUBLIC_KEY: ${{ vars.ECOREX_PUBLICATION_SIGNER_PUBLIC_KEY }}
          PUBLICATION_MODE: ${{ inputs.publication_mode }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          test -n "$ECOREX_PRODUCTION_CLOUD_SPEC"
          test -n "$ECOREX_PRODUCTION_PUBLIC_SITE_ROOT"
          cloud_manifest_sha="$(python -c 'import json; print(json.load(open(".deployment/protected-deployment-admission.json"))["admission"]["targets"]["cloud"]["manifest_sha256"])')"
          release_id="$(python -c 'import json; print(json.load(open(".deployment/protected-deployment-admission.json"))["admission"]["candidate"]["release_id"])')"
          cloud_upload_root="/srv/ecorex-upload/${release_id}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$cloud_upload_root"
          install -d -m 0700 "$cloud_upload_root"
          cp -a .deployment/output/cloud/. "$cloud_upload_root/"
          ECOREX_CLOUD_UPLOAD_ROOT="$cloud_upload_root" \
          ECOREX_CLOUD_MANIFEST_SHA256="$cloud_manifest_sha" \
          ECOREX_CLOUD_RELEASE_ID="$release_id" \
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          source = Path(os.environ['ECOREX_PRODUCTION_CLOUD_SPEC'])
          value = json.loads(source.read_text(encoding='utf-8'))
          artifact = Path(os.environ['ECOREX_CLOUD_UPLOAD_ROOT'])
          manifest = artifact / 'cloud-release-manifest.json'
          observed = hashlib.sha256(manifest.read_bytes()).hexdigest()
          expected = os.environ['ECOREX_CLOUD_MANIFEST_SHA256']
          if observed != expected:
              raise SystemExit('admitted_cloud_manifest_mismatch')
          manifest_value = json.loads(manifest.read_text(encoding='utf-8'))
          value.update({
              'release_id': os.environ['ECOREX_CLOUD_RELEASE_ID'],
              'source_commit': os.environ['GITHUB_SHA'],
              'dependency_lock_manifest_sha256': manifest_value['dependency_lock_manifest_sha256'],
              'artifact_root': str(artifact),
              'artifact_manifest_sha256': expected,
          })
          target = Path('.deployment/production-cloud-spec.json')
          target.write_text(json.dumps(value, sort_keys=True, separators=(',', ':')) + '\n', encoding='utf-8')
          target.chmod(0o600)
          PY
          python scripts/deploy-v1-cloud-sidecar.py \
            --spec .deployment/production-cloud-spec.json \
            --apply \
            --confirm-target "$cloud_manifest_sha"
          target_stage="$ECOREX_PRODUCTION_PUBLIC_SITE_ROOT/site-staging/$release_id"
          test ! -e "$target_stage"
          install -d -m 0700 "$target_stage"
          cp -a ".deployment/site-staging/$release_id/." "$target_stage/"
          python scripts/deploy-v1-public-site.py \
            --apply \
            --release-id "$release_id" \
            --confirm-target "https://dl.ecoremedia.net/ecorex-agent/"
          if [[ "$RELEASE_CHANNEL" == "stable" && "$PUBLICATION_MODE" == "create-and-activate" ]]; then
            ecorex-release activate-public-bootstrap-index \
              --release-dir .deployment/output/release \
              --publication-receipt .deployment/output/publication-receipt.json \
              --index .deployment/output/public-bootstrap-index.json \
              --stage-receipt .deployment/output/bootstrap-index-stage-receipt.json \
              --publication-config "$BOOTSTRAP_INDEX_PUBLICATION_CONFIG" \
              --receipt .deployment/output/bootstrap-index-publication-receipt.json \
              --trusted-key "$KEY_ID=$PUBLIC_KEY" \
              --trusted-publication-key "$PUBLICATION_KEY_ID=$PUBLICATION_PUBLIC_KEY"
          fi

      - name: Upload atomic activation journals
        if: ${{ always() }}
        id: production_deployment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecorex-v1-production-deployment-${{ inputs.channel }}-${{ github.run_id }}
          path: .deployment
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  authorize-finalization:
    name: Sign post-activation evidence without production credentials
    if: ${{ inputs.publication_mode == 'create-and-activate' }}
    needs: deploy-production
    environment:
      name: ecorex-deployment-authorization
    runs-on: [self-hosted, linux, arm64, ecorex-deployment-authorize]
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      finalized_artifact_id: ${{ steps.finalized_deployment.outputs.artifact-id }}
      finalized_artifact_sha256: ${{ steps.finalized_deployment.outputs.artifact-digest }}
    steps:
      - name: Checkout exact protected evidence authority
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download deployment journal and exact admitted bytes
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.deploy-production.outputs.deployment_result_artifact_id }}
          ARTIFACT_SHA256: ${{ needs.deploy-production.outputs.deployment_result_artifact_sha256 }}
        run: |
          curl --fail --location --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            --output .production-deployment.zip \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip"
          python scripts/extract-v1-workflow-artifact.py \
            --archive .production-deployment.zip \
            --expected-sha256 "$ARTIFACT_SHA256" \
            --output .deployment \
            --required-root output \
            --required-root gates \
            --required-root site-staging \
            --required-root protected-deployment-admission.json \
            --required-root authorized-deployment-extraction.json \
            --required-root production-cloud-spec.json \
            --receipt .deployment/production-deployment-extraction.json

      - name: Assemble final stable evidence after Bootstrap activation
        if: ${{ inputs.channel == 'stable' }}
        run: >-
          python scripts/assemble-v1-release-evidence.py
          --phase finalize
          --receipts-dir .deployment/gates
          --manifest .deployment/output/release/release-manifest.json
          --publication-receipt .deployment/output/publication-receipt.json
          --bootstrap-index-receipt .deployment/output/bootstrap-index-publication-receipt.json
          --expected-commit "${{ github.sha }}"
          --expected-workflow-run-id "${{ inputs.candidate_run_id }}"
          --output .deployment/output/release-evidence-unsigned.json

      - name: Sign final stable evidence
        if: ${{ inputs.channel == 'stable' }}
        env:
          ECOREX_RELEASE_SIGNER_EXECUTABLE: ${{ vars.ECOREX_RELEASE_SIGNER_EXECUTABLE }}
          ECOREX_RELEASE_SIGNER_EXECUTABLE_SHA256: ${{ vars.ECOREX_RELEASE_SIGNER_EXECUTABLE_SHA256 }}
          ECOREX_RELEASE_SIGNER_ADAPTER: ${{ vars.ECOREX_RELEASE_SIGNER_ADAPTER }}
          ECOREX_RELEASE_SIGNER_ADAPTER_SHA256: ${{ vars.ECOREX_RELEASE_SIGNER_ADAPTER_SHA256 }}
          ECOREX_RELEASE_SIGNER_KEY_ID: ${{ vars.ECOREX_RELEASE_SIGNER_KEY_ID }}
          ECOREX_RELEASE_SIGNER_PUBLIC_KEY: ${{ vars.ECOREX_RELEASE_SIGNER_PUBLIC_KEY }}
        run: >-
          python scripts/sign-v1-release-gate-bundle.py
          --unsigned .deployment/output/release-evidence-unsigned.json
          --manifest .deployment/output/release/release-manifest.json
          --output .deployment/output/release-evidence.json

      - name: Upload final evidence for rollout activation
        id: finalized_deployment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecorex-v1-finalized-deployment-${{ inputs.channel }}-${{ github.run_id }}
          path: .deployment
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  activate-rollout:
    name: Activate admitted rollout with final signed evidence
    if: ${{ inputs.publication_mode == 'create-and-activate' }}
    needs: authorize-finalization
    environment:
      name: ecorex-production-deployment-${{ inputs.channel }}
    runs-on: [self-hosted, linux, arm64, ecorex-production-deploy]
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout immutable production executor
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download only final signed deployment evidence
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.authorize-finalization.outputs.finalized_artifact_id }}
          ARTIFACT_SHA256: ${{ needs.authorize-finalization.outputs.finalized_artifact_sha256 }}
        run: |
          curl --fail --location --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            --output .finalized-deployment.zip \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip"
          python scripts/extract-v1-workflow-artifact.py \
            --archive .finalized-deployment.zip \
            --expected-sha256 "$ARTIFACT_SHA256" \
            --output .deployment \
            --required-root output \
            --required-root gates \
            --required-root site-staging \
            --required-root protected-deployment-admission.json \
            --required-root authorized-deployment-extraction.json \
            --required-root production-cloud-spec.json \
            --required-root production-deployment-extraction.json \
            --receipt .deployment/finalized-deployment-extraction.json

      - name: Re-authenticate admission then activate rollout
        env:
          ECOREX_CONTROL_PLANE_TOKEN: ${{ secrets.ECOREX_CONTROL_PLANE_TOKEN }}
          ECOREX_CONTROL_PLANE_URL: ${{ vars.ECOREX_CONTROL_PLANE_URL }}
          ECOREX_CONTROL_PLANE_HOSTS: ${{ vars.ECOREX_CONTROL_PLANE_HOSTS }}
          ADMISSION_KEY_ID: ${{ vars.ECOREX_DEPLOYMENT_SIGNER_KEY_ID }}
          ADMISSION_PUBLIC_KEY: ${{ vars.ECOREX_DEPLOYMENT_SIGNER_PUBLIC_KEY }}
          KEY_ID: ${{ vars.ECOREX_RELEASE_SIGNER_KEY_ID }}
          PUBLIC_KEY: ${{ vars.ECOREX_RELEASE_SIGNER_PUBLIC_KEY }}
        run: |
          python scripts/verify-v1-protected-deployment-admission.py \
            --admission .deployment/protected-deployment-admission.json \
            --trusted-key "$ADMISSION_KEY_ID=$ADMISSION_PUBLIC_KEY" \
            --repository "${GITHUB_REPOSITORY}" \
            --commit-sha "${GITHUB_SHA}" \
            --candidate-run-id "${{ inputs.candidate_run_id }}" \
            --candidate-artifact-id "${{ inputs.candidate_artifact_id }}" \
            --channel "${{ inputs.channel }}" \
            --mode "${{ inputs.publication_mode }}" \
            --rollout-percentage "${{ inputs.rollout_percentage }}"
          ecorex-release promote \
            --phase auto \
            --manifest .deployment/output/release/release-manifest.json \
            --evidence .deployment/output/release-evidence.json \
            --publication-receipt .deployment/output/publication-receipt.json \
            --trusted-key "$KEY_ID=$PUBLIC_KEY" \
            --journal .deployment/output/promotion-journal.json \
            --percentage "${{ inputs.rollout_percentage }}" \
            --activate

  finalize-production:
    name: Independent public and admin readback
    if: ${{ inputs.publication_mode == 'create-and-activate' }}
    needs:
      - deploy-production
      - authorize-finalization
      - activate-rollout
    environment:
      name: ecorex-production-readback
    runs-on: [self-hosted, linux, arm64, ecorex-production-readback]
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: Read back production without deployment credentials
        env:
          ECOREX_PUBLIC_ORIGIN: ${{ vars.ECOREX_PUBLIC_ORIGIN }}
          ECOREX_ADMIN_HEALTH_URL: ${{ vars.ECOREX_ADMIN_HEALTH_URL }}
        run: |
          curl --fail --silent --show-error --location \
            --max-time 30 "$ECOREX_PUBLIC_ORIGIN" >/dev/null
          curl --fail --silent --show-error --location \
            --max-time 30 "$ECOREX_ADMIN_HEALTH_URL" | grep -F '"status":"ready"'
