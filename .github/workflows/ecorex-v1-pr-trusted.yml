name: EcoreX v1 trusted PR development gate

on:
  pull_request_target:
    branches: [main]

permissions:
  contents: read

jobs:
  development-gate:
    name: v1 PR trusted development gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.9"

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"

      - name: Install Python development dependencies
        run: python scripts/install-v1-python-profile.py --profile dev

      - name: Check Python
        run: python scripts/run-v1-lint.py --compile

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build desktop WebUI
        working-directory: desktop
        run: npm run build:web

      - name: Check desktop types
        working-directory: desktop
        run: npm run typecheck

      - name: Test desktop contracts
        working-directory: desktop
        run: npm run test:v1

      - name: Test affected Python contracts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          mapfile -d '' tests < <(
            git diff --name-only -z --diff-filter=ACMRT "$BASE_SHA"...HEAD -- 'tests/**/*.py'
          )
          mapfile -d '' guarded < <(
            git diff --name-only -z --diff-filter=ACMRT "$BASE_SHA"...HEAD -- \
              ':(glob)**/*.py' ':(exclude,glob)tests/**' \
              'config.json.template' 'pyproject.toml' 'requirements/**' \
              'runtime-packs/**' 'skills/skills_config.json'
          )
          if ((${#guarded[@]} && ! ${#tests[@]})); then
            echo 'python_product_change_requires_changed_regression' >&2
            exit 1
          fi
          if ((${#tests[@]})); then
            python -m pytest --collect-only -q "${tests[@]}"
            python -m pytest -q "${tests[@]}"
          fi
          if ((${#guarded[@]})); then
            python -m pytest -q \
              tests/v1/test_version_source.py \
              tests/v1/test_bootstrap_supervisor.py \
              tests/v1/test_connector_vault.py \
              tests/v1/test_output_service.py \
              tests/v1/test_runtime_state_machine_invariants.py \
              tests/v1/test_macos_codesign_contract.py \
              tests/v1/test_update_manifest.py \
              tests/v1/test_update_coordinator.py
          fi
