name: EcoreX v1 protected platform stage

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecorex-v1-platform-stage-${{ github.sha }}
  cancel-in-progress: false

jobs:
  stage:
    name: ${{ matrix.label }} real Runtime and Packs
    environment:
      name: ecorex-release-stage
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            config_key: WINDOWS_X64
            label: Windows x64
            platform: windows
            architecture: x64
            runs_on: '["self-hosted","windows","x64","ecorex-platform-windows"]'
          - id: macos-arm64
            config_key: MACOS_ARM64
            label: macOS arm64
            platform: macos
            architecture: arm64
            runs_on: '"macos-15"'
          - id: macos-x64
            config_key: MACOS_X64
            label: macOS x64
            platform: macos
            architecture: x64
            runs_on: '"macos-15-intel"'
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    timeout-minutes: 60

    steps:
      - name: Refuse unprotected or non-dispatch execution
        if: ${{ github.event_name != 'workflow_dispatch' || github.ref_protected != true }}
        shell: bash
        run: exit 1

      - name: Checkout immutable source without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.11
        if: ${{ runner.os != 'Windows' }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.9"

      - name: Set up isolated Python 3.11 on Windows
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $uvVersion = "0.11.7"
          $uvArchive = Join-Path $env:RUNNER_TEMP "uv-$uvVersion-x86_64-pc-windows-msvc.zip"
          $uvRoot = Join-Path $env:RUNNER_TEMP "uv-$uvVersion"
          $pythonRoot = Join-Path $env:RUNNER_TEMP "python-3.11.9"
          Invoke-WebRequest -Uri "https://github.com/astral-sh/uv/releases/download/$uvVersion/uv-x86_64-pc-windows-msvc.zip" -OutFile $uvArchive -UseBasicParsing
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $uvArchive).Hash.ToLowerInvariant()
          $expected = "fe0c7815acf4fc45f8a5eff58ed3cf7ae2e15c3cf1dceadbd10c816ec1690cc1"
          if ($actual -ne $expected) {
            throw "uv_archive_digest_mismatch"
          }
          Expand-Archive -LiteralPath $uvArchive -DestinationPath $uvRoot -Force
          $uv = Join-Path $uvRoot "uv.exe"
          $observedUv = (& $uv --version).Trim()
          if ($observedUv -notmatch "^uv 0\.11\.7 \(9d177269e ") {
            throw "uv_toolchain_mismatch:$observedUv"
          }
          $env:UV_PYTHON_INSTALL_DIR = $pythonRoot
          & $uv --no-config python install --install-dir $pythonRoot --no-bin --no-registry --no-cache --managed-python --compile-bytecode 3.11.9
          if ($LASTEXITCODE -ne 0) {
            throw "python_toolchain_install_failed:$LASTEXITCODE"
          }
          $python = (& $uv --no-config python find --no-project --managed-python --no-python-downloads --resolve-links 3.11.9).Trim()
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) {
            throw "python_executable_missing"
          }
          $observedVersion = (& $python -c "import platform; print(platform.python_version())").Trim()
          if ($observedVersion -ne "3.11.9") {
            throw "python_toolchain_mismatch:$observedVersion"
          }
          # uv-managed base interpreters are PEP 668 protected.  The Stage
          # dependencies belong in a disposable venv rooted in RUNNER_TEMP;
          # mutating or bypassing the managed base would make the build both
          # non-repeatable and dependent on runner state.
          $venvName = "ecorex-platform-stage-venv-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}"
          $venvRoot = Join-Path $env:RUNNER_TEMP $venvName
          if (Test-Path -LiteralPath $venvRoot) {
            throw "python_venv_root_not_clean:$venvName"
          }
          & $python -m venv $venvRoot
          if ($LASTEXITCODE -ne 0) {
            throw "python_venv_creation_failed:$LASTEXITCODE"
          }
          $installRoot = $venvRoot
          $venvPython = Join-Path $installRoot "Scripts\python.exe"
          $venvVersion = (& $venvPython -c "import platform; print(platform.python_version())").Trim()
          if ($venvVersion -ne "3.11.9") {
            throw "python_venv_toolchain_mismatch:$venvVersion"
          }
          @(
            "pythonLocation=$installRoot",
            "Python_ROOT_DIR=$installRoot",
            "Python3_ROOT_DIR=$installRoot"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $installRoot "Scripts") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up Node 22 for the one final Web build
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Go 1.26.5 for the dependency-free Bootstrap
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.5"
          cache: false
          cache-dependency-path: platform-staging/bootstrap/go.mod

      - name: Install exact stage dependencies and managed Chromium
        run: |
          python scripts/install-v1-python-profile.py --profile platform-stage
          python scripts/check-v1-dependency-locks.py
          python -m playwright install chromium

      - name: Materialize digest-fenced production Runtime config
        env:
          ECOREX_STAGE_RUNTIME_CONFIG_BASE64: ${{ vars[format('ECOREX_STAGE_RUNTIME_CONFIG_{0}_BASE64', matrix.config_key)] }}
          ECOREX_STAGE_RUNTIME_CONFIG_SHA256: ${{ vars[format('ECOREX_STAGE_RUNTIME_CONFIG_{0}_SHA256', matrix.config_key)] }}
        run: >-
          python scripts/materialize-v1-stage-runtime-config.py materialize
          --output "${{ runner.temp }}/ecorex-runtime-config.json"
          --receipt .candidate/stage-runtime-config-materialization.json

      - name: Build the final content-addressed Web dist
        working-directory: desktop
        run: |
          npm ci
          npm run typecheck
          npm run test:v1
          npm run build

      - name: Build real Core and six Packs with the source-pinned stager
        env:
          ECOREX_STAGE_RUNTIME_CONFIG_TEMPLATE: ${{ runner.temp }}/ecorex-runtime-config.json
          ECOREX_STAGE_RUNTIME_CONFIG_TEMPLATE_SHA256: ${{ vars[format('ECOREX_STAGE_RUNTIME_CONFIG_{0}_SHA256', matrix.config_key)] }}
          ECOREX_PUBLIC_BOOTSTRAP_INDEX_URL: ${{ vars.ECOREX_PUBLIC_BOOTSTRAP_INDEX_URL }}
          ECOREX_PUBLICATION_PUBLIC_KEYS_JSON: ${{ vars.ECOREX_PUBLICATION_PUBLIC_KEYS_JSON }}
        run: >-
          python scripts/run-v1-repo-platform-stage.py
          --output-root .candidate/stage
          --platform ${{ matrix.platform }}
          --architecture ${{ matrix.architecture }}
          --commit-sha ${{ github.sha }}
          --workflow-run-id ${{ github.run_id }}
          --workflow-run-attempt ${{ github.run_attempt }}

      - name: Upload real stage and content-bound receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecorex-v1-stage-${{ matrix.id }}
          path: .candidate/stage
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3

      - name: Upload typed failure receipt
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecorex-v1-stage-failure-${{ matrix.id }}
          path: .candidate/stage/stage-failure.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

      - name: Remove materialized Runtime config
        if: ${{ always() }}
        env:
          ECOREX_STAGE_RUNTIME_CONFIG_SHA256: ${{ vars[format('ECOREX_STAGE_RUNTIME_CONFIG_{0}_SHA256', matrix.config_key)] }}
        run: >-
          python scripts/materialize-v1-stage-runtime-config.py remove
          --output "${{ runner.temp }}/ecorex-runtime-config.json"
