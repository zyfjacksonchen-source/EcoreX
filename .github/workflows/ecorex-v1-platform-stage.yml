name: EcoreX v1 protected platform stage

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecorex-v1-platform-stage-${{ github.sha }}
  cancel-in-progress: false

jobs:
  stage:
    name: ${{ matrix.label }} real Runtime and Packs
    environment:
      name: ecorex-release-stage
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            config_key: WINDOWS_X64
            label: Windows x64
            platform: windows
            architecture: x64
            runs_on: '["self-hosted","windows","x64","ecorex-release-stage"]'
          - id: macos-arm64
            config_key: MACOS_ARM64
            label: macOS arm64
            platform: macos
            architecture: arm64
            runs_on: '["self-hosted","macOS","ARM64","ecorex-release-stage"]'
          - id: macos-x64
            config_key: MACOS_X64
            label: macOS x64
            platform: macos
            architecture: x64
            runs_on: '["self-hosted","macOS","X64","ecorex-release-stage"]'
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    timeout-minutes: 60

    steps:
      - name: Refuse unprotected or non-dispatch execution
        if: ${{ github.event_name != 'workflow_dispatch' || github.ref_protected != true }}
        shell: bash
        run: exit 1

      - name: Checkout immutable source without persisted credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.9"

      - name: Set up Node 22 for the one final Web build
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Go 1.26.5 for the dependency-free Bootstrap
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.5"
          cache: false
          cache-dependency-path: platform-staging/bootstrap/go.mod

      - name: Install exact stage dependencies and managed Chromium
        run: |
          python scripts/install-v1-python-profile.py --profile platform-stage
          python scripts/check-v1-dependency-locks.py
          python -m playwright install chromium

      - name: Build the final content-addressed Web dist
        working-directory: desktop
        run: |
          npm ci
          npm run typecheck
          npm run test:v1
          npm run build

      - name: Build real Core and six Packs with the source-pinned stager
        env:
          ECOREX_STAGE_RUNTIME_CONFIG_TEMPLATE: ${{ vars[format('ECOREX_STAGE_RUNTIME_CONFIG_{0}_PATH', matrix.config_key)] }}
          ECOREX_STAGE_RUNTIME_CONFIG_TEMPLATE_SHA256: ${{ vars[format('ECOREX_STAGE_RUNTIME_CONFIG_{0}_SHA256', matrix.config_key)] }}
          ECOREX_PUBLIC_BOOTSTRAP_INDEX_URL: ${{ vars.ECOREX_PUBLIC_BOOTSTRAP_INDEX_URL }}
          ECOREX_PUBLICATION_PUBLIC_KEYS_JSON: ${{ vars.ECOREX_PUBLICATION_PUBLIC_KEYS_JSON }}
        run: >-
          python scripts/run-v1-repo-platform-stage.py
          --output-root .candidate/stage
          --platform ${{ matrix.platform }}
          --architecture ${{ matrix.architecture }}
          --commit-sha ${{ github.sha }}
          --workflow-run-id ${{ github.run_id }}
          --workflow-run-attempt ${{ github.run_attempt }}

      - name: Upload real stage and content-bound receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ecorex-v1-stage-${{ matrix.id }}
          path: .candidate/stage
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3

      - name: Upload typed failure receipt
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ecorex-v1-stage-failure-${{ matrix.id }}
          path: .candidate/stage/stage-failure.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
