<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EcoreX 管理后台</title>
    <meta name="robots" content="noindex,nofollow" />
    <link rel="icon" href="../assets/icon.png" />
    <link rel="stylesheet" href="./admin.css" />
  </head>
  <body>
    <aside class="sidebar">
      <a class="brand" href="../" aria-label="返回 EcoreX 下载中心">
        <span class="brand-mark" aria-hidden="true">E</span>
        <span>EcoreX</span>
      </a>
      <nav aria-label="管理导航">
        <button class="nav-item active" type="button" data-panel="users">用户</button>
        <button class="nav-item" type="button" data-panel="usage">用量</button>
        <button class="nav-item" type="button" data-panel="logs">错误回溯</button>
        <button class="nav-item" type="button" data-panel="models">模型</button>
        <button class="nav-item" type="button" data-panel="capabilities">能力包</button>
        <button class="nav-item" type="button" data-panel="release">发布</button>
      </nav>
      <a class="back-link" href="../">下载中心</a>
    </aside>

    <main class="workspace">
      <header class="workspace-header">
        <div>
          <p class="eyebrow">企业管理</p>
          <h1>管理员控制台</h1>
        </div>
        <div class="header-actions">
          <span class="api-status" data-api-status>连接中</span>
          <button class="theme-toggle" type="button" data-theme-toggle>明暗切换</button>
        </div>
      </header>
      <div class="admin-notice" data-admin-notice hidden></div>

      <section class="metric-grid" aria-label="概览指标">
        <article><span>用户</span><strong data-metric="users">0</strong></article>
        <article><span>Token</span><strong data-metric="tokens">0</strong></article>
        <article><span>未读错误</span><strong data-metric="errors">0</strong></article>
        <article><span>能力包</span><strong data-metric="capabilities">0</strong></article>
        <article><span>模型</span><strong data-metric="modelCredentials">0</strong></article>
        <article><span>客户端版本</span><strong data-metric="version">0.1.17</strong></article>
      </section>

      <section class="panel active" data-panel-view="users">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Users</p>
            <h2>用户创建与权限</h2>
          </div>
        </div>
        <form class="form-grid" data-user-form>
          <label>姓名<input name="name" autocomplete="off" required /></label>
          <label>登录邮箱<input name="email" type="email" autocomplete="off" required /></label>
          <label>初始密码<input name="initialPassword" type="password" minlength="8" autocomplete="new-password" required /></label>
          <label>角色<select name="role"><option value="member">成员</option><option value="admin">管理员</option></select></label>
          <label>日限额 Token<input name="dailyTokenLimit" type="number" min="0" step="1000" placeholder="0 为不限" /></label>
          <label>周限额 Token<input name="weeklyTokenLimit" type="number" min="0" step="1000" placeholder="0 为不限" /></label>
          <button type="submit">创建用户</button>
        </form>
        <div class="table user-table" data-users></div>
      </section>

      <section class="panel" data-panel-view="usage">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Usage</p>
            <h2>按用户查看 Token 用量</h2>
          </div>
          <button class="soft-button" type="button" data-refresh>刷新</button>
        </div>
        <div class="table usage-table" data-usage-users></div>
      </section>

      <section class="panel" data-panel-view="logs">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Errors</p>
            <h2>用户设备错误回溯</h2>
          </div>
          <button class="soft-button" type="button" data-clear-errors>标记错误已读</button>
        </div>
        <form class="filter-bar" data-log-filter>
          <label>用户<select name="userEmail" data-log-user-filter><option value="">全部用户</option></select></label>
          <label>级别<select name="level"><option value="error" selected>失败</option></select></label>
          <label>设备<input name="deviceId" placeholder="设备 ID" autocomplete="off" /></label>
          <label>开始<input name="from" type="date" /></label>
          <label>结束<input name="to" type="date" /></label>
          <button type="submit">筛选</button>
        </form>
        <div class="log-list" data-logs></div>
      </section>

      <section class="panel" data-panel-view="models">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Models</p>
            <h2>企业全局模型</h2>
          </div>
          <button class="primary-button" type="button" data-model-edit>编辑模型</button>
        </div>
        <div class="model-card" data-global-model></div>
      </section>

      <section class="panel" data-panel-view="capabilities">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Capabilities</p>
            <h2>能力包策略</h2>
          </div>
        </div>
        <form class="form-grid compact" data-capability-form>
          <label>PyPI / 内网镜像<input name="mirror" autocomplete="off" /></label>
          <label>离线缓存地址<input name="offlineCache" autocomplete="off" /></label>
          <label>默认策略<select name="mode"><option value="ask">首次使用询问安装</option><option value="preinstall">管理员预置</option><option value="disabled">禁用普通用户安装</option></select></label>
          <button type="submit">保存策略</button>
        </form>
        <div class="capability-policy" data-capability-policy></div>
        <div class="capability-list" data-capabilities></div>
      </section>

      <section class="panel" data-panel-view="release">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Release</p>
            <h2>客户端发布状态</h2>
          </div>
          <a class="soft-link" href="../manifest.json">查看 manifest</a>
        </div>
        <div class="release-list" data-release></div>
      </section>
    </main>

    <div class="modal-backdrop" data-modal hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <header>
          <h2 id="modal-title" data-modal-title>编辑</h2>
          <button class="icon-button" type="button" data-modal-close aria-label="关闭">×</button>
        </header>
        <div data-modal-body></div>
      </section>
    </div>

    <template data-template="edit-user">
      <form class="modal-form" data-edit-user-form>
        <input name="id" type="hidden" />
        <label>姓名<input name="name" required /></label>
        <label>登录邮箱<input name="email" type="email" required /></label>
        <label>角色<select name="role"><option value="member">成员</option><option value="admin">管理员</option></select></label>
        <label>状态<select name="status"><option value="active">可用</option><option value="invited">待首次登录</option><option value="disabled">禁用</option></select></label>
        <label>日限额 Token<input name="dailyTokenLimit" type="number" min="0" step="1000" /></label>
        <label>周限额 Token<input name="weeklyTokenLimit" type="number" min="0" step="1000" /></label>
        <button type="submit">保存用户</button>
      </form>
    </template>

    <template data-template="reset-password">
      <form class="modal-form" data-reset-password-form>
        <input name="id" type="hidden" />
        <p class="modal-note">重置后该用户需要使用新密码登录。密码不会写入日志。</p>
        <label>新密码<input name="password" type="password" minlength="8" autocomplete="new-password" required /></label>
        <button type="submit">重置密码</button>
      </form>
    </template>

    <template data-template="edit-model">
      <form class="modal-form" data-model-form>
        <label>配置名称<input name="name" autocomplete="off" required /></label>
        <label>供应商<select name="provider">
          <option value="custom">OpenAI 兼容</option>
          <option value="openai">OpenAI</option>
          <option value="deepseek">DeepSeek</option>
          <option value="zhipu">智谱</option>
          <option value="moonshot">Moonshot</option>
          <option value="doubao">火山方舟</option>
          <option value="qianfan">百度千帆</option>
          <option value="gemini">Gemini</option>
          <option value="claude">Claude</option>
        </select></label>
        <label>模型名称<input name="model" autocomplete="off" required /></label>
        <label>Base URL<input name="baseUrl" autocomplete="off" required /></label>
        <label>调用类型<select name="botType">
          <option value="custom">custom（自定义兼容）</option>
          <option value="openai">openai（OpenAI 兼容层）</option>
          <option value="deepseek">deepseek</option>
          <option value="zhipuai">zhipuai</option>
          <option value="moonshot">moonshot</option>
          <option value="doubao">doubao</option>
          <option value="qianfan">qianfan</option>
          <option value="gemini">gemini</option>
          <option value="claudeapi">claudeapi</option>
        </select></label>
        <label>API Key<input name="apiKey" autocomplete="off" placeholder="留空则保留原密钥" /></label>
        <label>生图模型（可选）<input name="imageModel" autocomplete="off" placeholder="不填默认 gpt-image-2-pro" /></label>
        <div class="model-test-actions" aria-label="模型测试">
          <button type="button" data-model-test="connectivity">测试联通</button>
          <button type="button" data-model-test="chat">测试会话</button>
          <button type="button" data-model-test="image">测试生图</button>
        </div>
        <div class="model-test-result" data-model-test-result>
          <strong>尚未测试</strong>
          <span>保存前可以先测试当前填写的 Base URL、API Key 和模型名。</span>
        </div>
        <button type="submit">保存全局模型</button>
      </form>
    </template>

    <script src="./admin.js"></script>
  </body>
</html>
