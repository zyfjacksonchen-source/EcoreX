# Include inside the existing TLS server. The active include is an atomic
# symlink to one of the two immutable slot files above.
include /etc/nginx/ecorex-cloud/active-control-plane.conf;

location = /ecorex-agent/admin {
    return 308 /ecorex-agent/admin/;
}

location = /admin {
    return 308 /ecorex-agent/admin/;
}

location ^~ /admin/ {
    return 308 /ecorex-agent/admin/;
}

location ^~ /ecorex-agent/admin/ {
    rewrite ^/ecorex-agent/admin/(.*)$ /admin/$1 break;
    proxy_pass $ecorex_control_plane;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
}

location = /api/v1/admin {
    proxy_pass $ecorex_control_plane;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
}

location ^~ /api/v1/admin/ {
    proxy_pass $ecorex_control_plane;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
}

# Device authorization and the operator verification page are Control Plane
# authorities. Request bodies/query strings are deliberately absent from
# access-log customization in this include.
location ^~ /v1/device/ {
    client_max_body_size 64k;
    proxy_pass $ecorex_control_plane;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
}

location = /device {
    proxy_pass $ecorex_control_plane;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
}

location ^~ /api/v1/releases/ {
    proxy_pass $ecorex_control_plane;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
}

location = /api/v1/client/updates/ws {
    proxy_pass $ecorex_control_plane;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 310s;
    proxy_send_timeout 30s;
    proxy_buffering off;
}

location ^~ /api/v1/shares {
    client_max_body_size 64m;
    proxy_pass $ecorex_control_plane;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_request_buffering off;
    proxy_buffering off;
}

location = /api/v1/audit/records {
    client_max_body_size 4m;
    proxy_pass $ecorex_control_plane;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
}

location = /api/v1/models {
    proxy_pass $ecorex_gateway;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
}

location = /api/v1/model/stream {
    client_max_body_size 4m;
    proxy_pass $ecorex_gateway;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 910s;
    proxy_send_timeout 60s;
    proxy_request_buffering off;
    proxy_buffering off;
    add_header X-Accel-Buffering no always;
}

location ^~ /api/v1/images/ {
    client_max_body_size 64m;
    proxy_pass $ecorex_image_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 910s;
    proxy_send_timeout 60s;
    proxy_request_buffering off;
    proxy_buffering off;
}
