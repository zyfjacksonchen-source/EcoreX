# Include inside the existing TLS server. The active include is an atomic
# symlink to one of the two immutable slot files above.
include /etc/nginx/ecorex-cloud/active-control-plane.conf;
include /etc/nginx/ecorex-cloud/active-admin-route.conf;

# Only finalized release directories are world-readable.  Dot-prefixed staging,
# crash residue and the durable ready marker are never part of the public asset
# namespace or online-verifier set.
location ~ "^/ecorex-agent/releases/(?<release_namespace>v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?)/(?<release_id>release-(?<release_channel>stable|canary)-[0-9a-f]{24})/(?<release_asset>[A-Za-z0-9][A-Za-z0-9._-]{0,179})$" {
    alias /srv/ecorex-agent-download/v1-artifacts/$release_namespace/$release_channel/$release_id/$release_asset;
    limit_except GET HEAD { deny all; }
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# No directory listing, staging name, crash residue or hidden ready marker can
# match the public file route above.
location /ecorex-agent/releases/ {
    return 404;
}

# The signed Bootstrap pointer is mutable only in freshness.  Keep it outside
# immutable public-site slots so the Control Plane can atomically renew the
# online freshness signature without changing the signed Web tree.
location = /ecorex-agent/public-bootstrap-index.json {
    alias /srv/ecorex-agent-download/public-pointer/public-bootstrap-index.json;
    default_type application/json;
    limit_except GET HEAD { deny all; }
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
}

location = /api/v1/admin {
    proxy_pass $ecorex_control_plane;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
}

# Direct-release admission embeds the exact signed Candidate receipt, waiver,
# publication receipt and manifest. The regex is anchored to the one dynamic
# PUT resource; every other release-admin path inherits the normal small body
# limit. Nginx buffers the bounded body before forwarding it.
location ~ "^/api/v1/admin/releases/[A-Za-z0-9][A-Za-z0-9._-]{0,127}/direct-admission$" {
    client_max_body_size 32m;
    client_body_timeout 10s;
    client_body_buffer_size 64k;
    limit_except PUT { deny all; }
    auth_request /_ecorex_release_admin_auth;
    proxy_pass $ecorex_control_plane;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
    proxy_request_buffering on;
    proxy_buffering off;
}

# Access-phase, no-body authorization for the large direct-admission route.
# `internal` prevents a public caller from treating this as an authentication
# oracle. Nginx completes this subrequest before it buffers the client body.
location = /_ecorex_release_admin_auth {
    internal;
    proxy_pass $ecorex_control_plane/api/v1/internal/release-admin-auth;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Host $host;
}

location /api/v1/admin/ {
    proxy_pass $ecorex_control_plane;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
}

# Device authorization and the operator verification page are Control Plane
# authorities. Request bodies/query strings are deliberately absent from
# access-log customization in this include.
location ^~ /v1/device/ {
    client_max_body_size 64k;
    proxy_pass $ecorex_control_plane;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
}

location = /device {
    proxy_pass $ecorex_control_plane;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
}

location ^~ /api/v1/releases/ {
    client_max_body_size 500m;
    proxy_pass $ecorex_control_plane;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
    proxy_request_buffering off;
    proxy_buffering off;
}

# Signed public bootstrap-index staging and activation are authenticated
# Control Plane mutations.  This API namespace is distinct from the immutable
# /ecorex-agent/releases/ static asset namespace above.
location ^~ /api/v1/bootstrap-index/ {
    client_max_body_size 4m;
    proxy_pass $ecorex_control_plane;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
    proxy_request_buffering off;
    proxy_buffering off;
}

location = /api/v1/client/updates/ws {
    proxy_pass $ecorex_control_plane;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 310s;
    proxy_send_timeout 30s;
    proxy_buffering off;
}

location ^~ /api/v1/shares {
    client_max_body_size 64m;
    proxy_pass $ecorex_control_plane;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_request_buffering off;
    proxy_buffering off;
}

location = /api/v1/audit/records {
    client_max_body_size 4m;
    proxy_pass $ecorex_control_plane;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
}

location = /api/v1/models {
    proxy_pass $ecorex_gateway;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
}

location = /api/v1/model/stream {
    client_max_body_size 4m;
    proxy_pass $ecorex_gateway;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 910s;
    proxy_send_timeout 60s;
    proxy_request_buffering off;
    proxy_buffering off;
    add_header X-Accel-Buffering no always;
}

location ^~ /api/v1/images/ {
    client_max_body_size 64m;
    proxy_pass $ecorex_image_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 910s;
    proxy_send_timeout 60s;
    proxy_request_buffering off;
    proxy_buffering off;
}
