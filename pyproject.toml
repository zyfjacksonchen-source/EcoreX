[build-system]
requires = ["setuptools==68.0.0", "wheel==0.42.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ecorex-agent-runtime"
dynamic = ["version"]
description = "e-Mate Enterprise local agent runtime"
requires-python = ">=3.11"
dependencies = [
    "aiohttp==3.14.3",
    "cryptography==46.0.7",
    "dingtalk-stream==0.24.3",
    "discord.py==2.7.1",
    "fastapi==0.115.0",
    "httpcore==1.0.9",
    "httpx==0.27.2",
    "lark-channel-sdk==1.2.0",
    "lark-oapi==1.7.2",
    "Pillow==12.3.0",
    "pycryptodome==3.23.0",
    "pydantic==2.12.5",
    "python-multipart==0.0.26",
    "python-telegram-bot==22.5",
    "qrcode==8.2",
    "regex==2026.7.19",
    "requests==2.32.5",
    "slack-bolt==1.30.0",
    "tzdata==2026.2",
    "uvicorn==0.30.0",
    "web.py==0.61",
    "websocket-client==1.9.0",
    "websockets==15.0.1",
    "wechatpy==1.8.18",
]

[project.optional-dependencies]
dev = [
    "jsonschema==4.26.0",
    "Pillow==12.3.0",
    "pytest==9.1.1",
    "ruff==0.15.21",
]
image-cloud = [
    "boto3==1.38.0",
    "Pillow==12.3.0",
    "psycopg[binary,pool]==3.2.1",
]
control-plane-cloud = [
    "boto3==1.38.0",
]

[project.scripts]
emate = "ecorex.server.cli:main"
emate-backend = "ecorex.server.cli:main"
emate-release = "ecorex.control_plane.cli:main"
emate-control-plane = "ecorex.control_plane.production:main"
emate-image = "ecorex.image_orchestrator.production:main"
emate-gateway = "ecorex.gateway.production:main"
ecorex = "ecorex.server.cli:main"
ecorex-product = "ecorex.server.cli:main"
ecorex-bootstrap = "ecorex.bootstrap.cli:main"
ecorex-release = "ecorex.control_plane.cli:main"
ecorex-control-plane = "ecorex.control_plane.production:main"
ecorex-image = "ecorex.image_orchestrator.production:main"
ecorex-gateway = "ecorex.gateway.production:main"
ecorex-gateway-schema = "ecorex.gateway.schema:main"
ecorex-share-schema = "ecorex.control_plane.share_schema:main"

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
include = ["ecorex*", "agent*", "bridge*", "models*", "channel*", "plugins*", "common*", "voice*", "translate*", "cli*"]
exclude = ["desktop*", "tests*"]

[tool.setuptools.package-data]
"ecorex.control_plane.admin_web" = ["static/*"]
"ecorex.control_plane" = ["seed_skills/official-writing/*"]

[tool.setuptools.dynamic]
version = {attr = "ecorex.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests/v1"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# The v1 baseline fails on syntax/import-order errors, duplicate definitions,
# undefined names and the rest of Pyflakes. Public package re-exports and the
# existing unused-variable debt remain explicit exceptions until their APIs are
# reduced without breaking compatibility.
select = ["E4", "E7", "E9", "F"]
ignore = ["F401", "F403", "F841"]
