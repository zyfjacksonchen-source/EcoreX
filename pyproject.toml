[build-system]
requires = ["setuptools>=45.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ecorex-agent-runtime"
version = "0.1.15"
description = "EcoreX local agent runtime"
requires-python = ">=3.7"
dependencies = [
    "click>=8.0",
    "requests>=2.28.2",
]

[project.scripts]
ecorex = "cli.cli:main"

[tool.setuptools.packages.find]
include = ["cli*"]
