default:
  model: gpt-image-2-pro
  fallback_model: gpt-image-2
  size: 1080x1440
  template: |
    Create a high-quality Xiaohongshu cover image in portrait 3:4 ratio.
    Brand/topic: {brand} / {topic}
    Audience: {audience}
    Visual direction: {visual_direction}
    Reference cover analysis: {reference_cover_analysis}
    Main visual anchor: {visual_anchor}
    Layout instructions: {layout_instructions}
    Mood: premium, real, readable, save-worthy.
    Prefer real product, real space, real usage state, and inspectable scene details over generic AI-looking backgrounds.
    Leave clean space for Chinese cover text: "{cover_hook}".
    The cover must not include CTA text such as private-message prompts, comment prompts, scan codes, WeChat prompts, consultation prompts, or领取/私信/评论 wording. Use proof labels or pain-point badges instead. CTA may be used on carousel inner pages, body copy, or first comment.
    Keep similarity to any single reference cover below 50%; do not copy exact text layout, color system, sticker placement, or composition.
    Do not add watermarks, platform UI, random text, celebrity likeness, unauthorized logos, abstract AI glow, fake UI panels, or generic futuristic gradients.
inner_page:
  size: 1080x1440
  template: |
    Create a Xiaohongshu inner page visual with clear editorial layout.
    Topic: {topic}
    Page purpose: {page_purpose}
    Use readable blocks, concise hierarchy, and no random text artifacts.
