<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EcoreX Document Preview</title>
  <link rel="stylesheet" href="./js-preview-lib/docx.css">
  <link rel="stylesheet" href="./js-preview-lib/excel.css">
  <style>
    html,
    body,
    #app {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0b121b;
      color: #dbe5f1;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 90, 0, 0.72) rgba(15, 23, 34, 0.96);
    }

    *::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    *::-webkit-scrollbar-track {
      background: #0d1520;
      border-radius: 999px;
    }

    *::-webkit-scrollbar-thumb {
      min-height: 44px;
      border: 2px solid #0d1520;
      border-radius: 999px;
      background: linear-gradient(180deg, #ff6a00, #e65000);
    }

    *::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, #ff7a1a, #ff5a00);
    }

    *::-webkit-scrollbar-corner {
      background: #0d1520;
    }

    #viewer {
      width: 100%;
      height: 100%;
      overflow: auto;
      background: #0b121b;
      color: #111827;
    }

    #viewer.office-docx {
      padding: 14px;
      background: #737982;
    }

    #viewer.office-pptx {
      padding: 18px;
      background: #05070b;
    }

    #status {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #0b121b;
      color: #dbe5f1;
      text-align: center;
      line-height: 1.5;
      z-index: 10;
    }

    #status.ready {
      display: none;
    }

    #status.error {
      color: #ff9a9a;
    }

    .vue-office-docx,
    .vue-office-docx-main,
    .vue-office-excel,
    .vue-office-excel-main,
    .vue-office-pdf,
    .pptx-preview-wrapper {
      width: 100%;
      min-height: 100%;
    }

    #viewer.office-docx .vue-office-docx,
    #viewer.office-docx .vue-office-docx-main {
      height: auto;
      min-height: 100%;
      overflow: visible;
      background: #737982 !important;
    }

    #viewer.office-docx .docx-wrapper {
      min-height: calc(100vh - 28px);
      padding: 18px 0 !important;
      background: #737982 !important;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    #viewer.office-docx .docx-wrapper > section.docx,
    #viewer.office-docx section.docx {
      width: min(816px, calc(100vw - 56px)) !important;
      min-height: 1056px !important;
      margin: 0 auto 18px !important;
      padding: 72px !important;
      background: #fff !important;
      color: #111827 !important;
      box-shadow: 0 14px 34px rgba(15, 23, 42, 0.32) !important;
    }

    @media (max-width: 720px) {
      #viewer.office-docx .docx-wrapper > section.docx,
      #viewer.office-docx section.docx {
        width: calc(100vw - 28px) !important;
        min-height: calc((100vw - 28px) * 1.294) !important;
        padding: 32px !important;
      }
    }

    .pptx-preview-wrapper {
      box-sizing: border-box;
      max-width: 100%;
      display: grid;
      justify-items: center;
      gap: 18px;
    }

    .pptx-preview-slide-wrapper {
      background: #fff;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.36);
    }

    .office-fallback {
      width: min(860px, 100%);
      min-height: min(520px, calc(100vh - 64px));
      margin: 0 auto;
      padding: 28px;
      border: 1px solid rgba(231, 238, 247, 0.16);
      border-radius: 8px;
      background: #fff;
      color: #111827;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.36);
      font: 16px/1.65 "Segoe UI", Arial, sans-serif;
    }

    .office-fallback h1 {
      margin: 0 0 16px;
      font-size: 22px;
      line-height: 1.3;
    }

    .office-fallback p {
      margin: 0 0 10px;
      white-space: pre-wrap;
    }

    .office-fallback .muted {
      color: #64748b;
      font-size: 13px;
    }

    .x-spreadsheet-scrollbar {
      background: #0d1520 !important;
      opacity: 1 !important;
    }

    .x-spreadsheet-scrollbar.horizontal,
    .x-spreadsheet-scrollbar.vertical {
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 90, 0, 0.72) #0d1520;
    }

    .x-spreadsheet-scrollbar.horizontal::-webkit-scrollbar,
    .x-spreadsheet-scrollbar.vertical::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    .x-spreadsheet-scrollbar.horizontal::-webkit-scrollbar-track,
    .x-spreadsheet-scrollbar.vertical::-webkit-scrollbar-track {
      background: #0d1520;
    }

    .x-spreadsheet-scrollbar.horizontal::-webkit-scrollbar-thumb,
    .x-spreadsheet-scrollbar.vertical::-webkit-scrollbar-thumb {
      border: 2px solid #0d1520;
      border-radius: 999px;
      background: linear-gradient(180deg, #ff6a00, #e65000);
    }

    .x-spreadsheet-scrollbar.horizontal > div,
    .x-spreadsheet-scrollbar.vertical > div {
      background: transparent !important;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="viewer"></div>
    <div id="status">Loading preview...</div>
  </div>
  <script src="./js-preview-lib/docx.umd.js"></script>
  <script src="./js-preview-lib/excel.umd.js"></script>
  <script src="./js-preview-lib/pdf.umd.js"></script>
  <script src="./js-preview-lib/pptx-preview.umd.js"></script>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const viewer = document.getElementById('viewer');
      const status = document.getElementById('status');
      const src = params.get('src') || '';
      const name = params.get('name') || 'preview-file';
      const type = normalizeType(params.get('type') || '', name);

      function setStatus(text, tone) {
        status.textContent = text;
        status.className = tone || '';
      }

      function normalizeType(rawType, fileName) {
        const normalized = String(rawType || '').toLowerCase();
        if (['pdf', 'docx', 'excel', 'pptx'].includes(normalized)) return normalized;
        const extension = String(fileName || '').toLowerCase().split('.').pop();
        if (extension === 'pdf') return 'pdf';
        if (extension === 'docx') return 'docx';
        if (['xls', 'xlsx', 'xlsm'].includes(extension)) return 'excel';
        if (['pptx', 'pptm'].includes(extension)) return 'pptx';
        return '';
      }

      function previewSourceUrl(value) {
        const url = new URL(value, window.location.href);
        if (url.origin !== window.location.origin || !url.pathname.startsWith('/preview-file/')) {
          throw new Error('Preview source is not a local authorized file URL.');
        }
        return url.href;
      }

      function notify(kind, detail) {
        try {
          window.parent.postMessage({
            type: 'ecorex-vue-office-preview',
            kind,
            name,
            detail: typeof detail === 'string' ? detail : JSON.stringify(detail || {})
          }, '*');
        } catch {
          // Parent notifications are best-effort only.
        }
      }

      function notifySelection() {
        try {
          const text = String(window.getSelection && window.getSelection().toString() || '').trim();
          if (!text) return;
          window.parent.postMessage({
            type: 'ecorex-preview-selection',
            text: text.slice(0, 900),
            fileName: name
          }, '*');
        } catch {
          // Selection bridge is best-effort only.
        }
      }

      let selectionTimer = 0;
      document.addEventListener('selectionchange', () => {
        window.clearTimeout(selectionTimer);
        selectionTimer = window.setTimeout(notifySelection, 160);
      });

      function escapeHtml(value) {
        return String(value || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function decodeXmlText(value) {
        return String(value || '')
          .replace(/&lt;/g, '<')
          .replace(/&gt;/g, '>')
          .replace(/&quot;/g, '"')
          .replace(/&apos;/g, "'")
          .replace(/&amp;/g, '&');
      }

      async function inflateZipEntry(bytes) {
        if (!bytes || !bytes.length) return bytes;
        if (typeof DecompressionStream !== 'function') return null;
        try {
          const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
          return new Uint8Array(await new Response(stream).arrayBuffer());
        } catch {
          return null;
        }
      }

      async function readZipTextEntries(arrayBuffer, matcher) {
        const bytes = new Uint8Array(arrayBuffer);
        const view = new DataView(arrayBuffer);
        const decoder = new TextDecoder('utf-8');
        const entries = [];
        let offset = 0;
        while (offset + 30 <= bytes.length && view.getUint32(offset, true) === 0x04034b50) {
          const flags = view.getUint16(offset + 6, true);
          const method = view.getUint16(offset + 8, true);
          const compressedSize = view.getUint32(offset + 18, true);
          const nameLength = view.getUint16(offset + 26, true);
          const extraLength = view.getUint16(offset + 28, true);
          const nameStart = offset + 30;
          const dataStart = nameStart + nameLength + extraLength;
          const name = decoder.decode(bytes.slice(nameStart, nameStart + nameLength));
          if ((flags & 0x08) || !compressedSize || dataStart + compressedSize > bytes.length) break;
          const compressed = bytes.slice(dataStart, dataStart + compressedSize);
          let data = null;
          if (method === 0) data = compressed;
          if (method === 8) data = await inflateZipEntry(compressed);
          if (data && matcher(name)) entries.push({ name, text: decoder.decode(data) });
          offset = dataStart + compressedSize;
        }
        return entries;
      }

      function extractOfficeXmlText(xml = '') {
        const matches = [...String(xml || '').matchAll(/<(?:a|w):t\b[^>]*>([\s\S]*?)<\/(?:a|w):t>/g)];
        return matches
          .map((match) => decodeXmlText(match[1]).replace(/\s+/g, ' ').trim())
          .filter(Boolean);
      }

      async function extractOfficeText(arrayBuffer, documentType) {
        const matcher = documentType === 'pptx'
          ? (entryName) => /^ppt\/slides\/slide\d+\.xml$/i.test(entryName)
          : (entryName) => /^word\/document\.xml$/i.test(entryName);
        const entries = await readZipTextEntries(arrayBuffer, matcher);
        return entries.flatMap((entry) => extractOfficeXmlText(entry.text));
      }

      function hasMeaningfulPptxRender() {
        const slideCandidates = viewer.querySelectorAll('.pptx-preview-slide-wrapper, [class*="slide"]');
        const hasSizedSlide = Array.from(slideCandidates).some((element) => {
          const rect = element.getBoundingClientRect();
          return rect.width > 160 && rect.height > 90;
        });
        const hasVisualContent = Boolean(viewer.querySelector('canvas, svg, img, video'));
        const hasText = String(viewer.textContent || '').trim().length > 0;
        return hasSizedSlide && (hasVisualContent || hasText);
      }

      async function waitForPreviewPaint() {
        await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        await new Promise((resolve) => window.setTimeout(resolve, 180));
      }

      async function waitWithTimeout(promise, timeoutMs, timeoutMessage) {
        let timeoutId = 0;
        const timeout = new Promise((resolve) => {
          timeoutId = window.setTimeout(() => resolve({ ok: false, error: timeoutMessage }), timeoutMs);
        });
        const result = await Promise.race([
          Promise.resolve(promise)
            .then(() => ({ ok: true, error: '' }))
            .catch((error) => ({ ok: false, error: String(error && error.message || error || 'Preview failed') })),
          timeout
        ]);
        window.clearTimeout(timeoutId);
        return result;
      }

      async function renderOfficeFallback(arrayBuffer, documentType, reason) {
        const textItems = await extractOfficeText(arrayBuffer, documentType).catch(() => []);
        const uniqueItems = [...new Set(textItems)].slice(0, 80);
        const paragraphs = uniqueItems.length
          ? uniqueItems.map((item) => `<p>${escapeHtml(item)}</p>`).join('')
          : '<p class="muted">未能提取到可展示文本。可以使用“本地打开”查看完整文件。</p>';
        viewer.innerHTML = [
          '<article class="office-fallback">',
          `<h1>${documentType === 'pptx' ? 'PPT 内容预览' : '文档内容预览'}</h1>`,
          reason ? `<p class="muted">${escapeHtml(reason)}</p>` : '',
          paragraphs,
          '</article>'
        ].join('');
      }

      function renderDetail(documentType, fallback) {
        return {
          documentType,
          fallback: Boolean(fallback),
          text: String(viewer.innerText || viewer.textContent || '').slice(0, 800),
          childCount: viewer.children.length,
          className: viewer.className
        };
      }

      async function run() {
        if (!src || !type) throw new Error('Preview URL or document type is missing.');
        const sourceUrl = previewSourceUrl(src);
        viewer.classList.add(`office-${type}`);
        let previewer = null;
        if (type === 'pdf') {
          previewer = window.jsPreviewPdf.init(viewer, {
            staticFileUrl: './js-preview-lib/',
            onError: (error) => notify('error', String(error && error.message || error || 'preview failed')),
            onRendered: () => notify('rendered')
          });
        } else if (type === 'docx') {
          previewer = window.jsPreviewDocx.init(viewer);
        } else if (type === 'excel') {
          previewer = window.jsPreviewExcel.init(viewer, { xls: /\.xls$/i.test(name), showContextmenu: false });
        } else if (type === 'pptx') {
          if (!window.pptxPreview || typeof window.pptxPreview.init !== 'function') {
            throw new Error('PPTX preview engine is unavailable.');
          }
          const response = await fetch(sourceUrl, { cache: 'no-store' });
          if (!response.ok) throw new Error(`Preview source request failed: ${response.status}`);
          const data = await response.arrayBuffer();
          await renderOfficeFallback(data, 'pptx', '');
          setStatus('', 'ready');
          notify('rendered', renderDetail('pptx', true));
          return;
        }
        if (!previewer || typeof previewer.preview !== 'function') throw new Error('Preview engine is unavailable.');
        await previewer.preview(sourceUrl);
        setStatus('', 'ready');
        notify('rendered', renderDetail(type, false));
      }

      run().catch((error) => {
        const message = error && error.message ? error.message : String(error || 'Preview failed.');
        setStatus(message, 'error');
        notify('error', message);
      });
    }());
  </script>
</body>
</html>
