appId: com.ecorex.desktop
productName: EcoreX
copyright: Copyright (c) 2026 EcoreX

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

asar: true

extraMetadata:
  main: dist-electron/main.js

publish:
  provider: generic
  url: https://www.ecoreai.cn/ecorex-agent/downloads/

extraFiles:
  - from: build/README-migration.txt
    to: README-migration.txt

extraResources:
  - from: runtime/ecorex-runtime
    to: ecorex-runtime
    filter:
      - "**/*"
  - from: build/README-macos-agent-install.txt
    to: README-macos-agent-install.txt

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: EcoreX_${version}_${arch}-setup.${ext}
  signExecutable: false
  forceCodeSigning: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

mac:
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  artifactName: EcoreX_${version}_${arch}.${ext}
  category: public.app-category.productivity

dmg:
  artifactName: EcoreX_${version}_${arch}.${ext}
  contents:
    - x: 130
      y: 220
      type: file
      name: EcoreX.app
    - x: 410
      y: 220
      type: link
      path: /Applications
    - x: 270
      y: 340
      type: file
      path: build/README-macos-agent-install.txt
      name: README-macos-agent-install.txt
